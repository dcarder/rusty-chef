<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2b2522">
  <title>You're offline | The Rusty Chef</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fbf7f2;color:#2b2522;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
    .box{max-width:380px}
    .logo{font-weight:700;font-size:1.4rem;margin-bottom:12px}.logo span{color:#b7472a}
    p{color:#6b625d;line-height:1.6}
    button{background:#b7472a;color:#fff;border:none;border-radius:8px;padding:12px 22px;font:inherit;font-size:1rem;cursor:pointer;margin-top:8px}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">The <span>Rusty</span> Chef</div>
    <h1>You're offline</h1>
    <p>Rusty can't reach the kitchen right now. Check your Wi-Fi or data connection, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
