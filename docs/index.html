<div id="home" class="page active">

<!-- Permanent tab bar - lives outside .page so fixed positioning works -->
<div id="tabBar" style="position:fixed;bottom:0;left:0;right:0;z-index:999;background:rgba(0,0,0,0.92);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,0.1);padding:8px 12px calc(12px + env(safe-area-inset-bottom, 0px));display:flex;gap:8px;">
  <div class="btn" onclick="openPantry()" style="flex:1;margin-top:0;padding:10px 4px;font-size:12px;line-height:1.4;">🧺<br>Pantry</div>
  <div class="btn" onclick="showMatches()" style="flex:1;margin-top:0;padding:10px 4px;font-size:12px;line-height:1.4;">🍳<br>Recipes</div>
  <div class="btn btn-fav" onclick="showFavorites()" style="flex:1;margin-top:0;padding:10px 4px;font-size:12px;line-height:1.4;">⭐<br>Saved</div>
</div>

<script>

/* ================= NAV ================= */
function show(id){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  requestAnimationFrame(() => document.getElementById(id).classList.add("active"));
}

/* ================= INGREDIENTS ================= */
let ingredientItems = []; // filled in automatically from the recipes below

function storeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function storeSet(k, v){ try{ storeSet(k, v); }catch(e){} }
function loadList(k){ try{ const v = JSON.parse(storeGet(k) || "[]"); return Array.isArray(v) ? v : []; }catch(e){ return []; } }

let selected = loadList("ingredients");
let favorites = loadList("favorites");

function toggleFavorite(idx){
  const name = typeof idx === "number" ? recipes[idx].name : idx;
  favorites = favorites.includes(name) ? favorites.filter(f=>f!==name) : [...favorites, name];
  storeSet("favorites", JSON.stringify(favorites));
  const star = document.querySelector('.fav-star');
  const isFav = favorites.includes(name);
  if(star){
    if(isFav){
      star.classList.add('saved');
      star.style.transform = 'scale(1.5)';
      setTimeout(() => star.style.transform = '', 200);
    } else {
      star.classList.remove('saved');
    }
  }
}

function showFavorites(){
  let html = `<div class="header">⭐ Saved Recipes</div>`;
  if(favorites.length === 0){
    html += `<div class="card" style="text-align:center;opacity:0.6;padding:30px;">
      No saved recipes yet.<br><br>Tap ⭐ on any recipe to save it here.
    </div>`;
  } else {
    favorites.forEach(name => {
      const r = recipes.find(x => x.name === name);
      if(!r) return;
      const match = r.ingredients.filter(i => selected.includes(i)).length;
      html += `
        <div class="card" style="display:flex;align-items:center;justify-content:space-between;" onclick="openRecipe(${recipes.findIndex(x=>x.name===name)})">
          <div><b>${name}</b><br><small style="opacity:0.6">Match: ${match}/${r.ingredients.length}</small></div>
          <span style="font-size:20px;color:#ffd700;">★</span>
        </div>`;
    });
  }
  html += `
    `;
  document.getElementById("favorites").innerHTML = html;
  show("favorites");
}

function clearPantry(){
  selected = [];
  storeSet("ingredients", JSON.stringify(selected));
  openPantry();
}

/* ================= RECIPES ================= */
const recipes = [

{
  name:"Chicken Fried Rice",
  category:"lunch",
  ingredients:["Rice","Eggs","Chicken breast","Soy sauce","Onions","Carrots"],
  simpleSteps:[
    {t:"Cook rice", a:"fluffy"},
    {t:"Cook chicken", a:"done"},
    {t:"Scramble eggs", a:"soft"},
    {t:"Mix everything", a:"hot pan"}
  ],
  chefSteps:[
    {
      t:"Prep and cook the rice",
      a:"Rinse the rice under cold water 2–3 times until the water runs mostly clear — this removes excess starch and prevents a gummy texture. Cook using a 1:1.5 rice-to-water ratio. Once done, spread the rice on a tray or plate and refrigerate for at least 30 minutes (overnight is even better). Cold, dry rice fries instead of steams, giving you those distinct separated grains.",
      tip:"Day-old leftover rice is ideal. Never use freshly cooked rice — it'll clump and turn mushy."
    },
    {
      t:"Season and cook the chicken",
      a:"Dice the chicken breast into small, even ½-inch cubes so they cook quickly and evenly. Season generously with salt and pepper. Heat a wok or large skillet over high heat until it just begins to smoke. Add a thin layer of neutral oil and cook the chicken in a single layer without stirring for 90 seconds to develop a golden sear, then toss and finish cooking through. Remove from pan and set aside.",
      tip:"High heat is non-negotiable. A hot wok creates 'wok hei' — that smoky, slightly charred flavor you can't get at low temperatures."
    },
    {
      t:"Scramble the eggs separately",
      a:"Push everything to the side of the wok or use a clean pan. Add a touch of butter and crack in the eggs. Scramble them low and slow — stir gently and pull off heat while still slightly underdone and glossy. They'll finish cooking from residual heat. Soft, custardy eggs fold into the rice beautifully rather than becoming rubbery chunks.",
      tip:"Salt your eggs just before scrambling, not ahead of time — pre-salting draws out moisture and makes them watery."
    },
    {
      t:"Fry the rice and combine everything",
      a:"Add the cold rice to the hot wok and press it flat. Let it sit undisturbed for 60–90 seconds so the bottom layer starts to crisp. Then toss and repeat once more. Add the soy sauce in a ring around the outer edge of the wok (not directly on the rice) so it hits the hot metal first and caramelizes slightly before mixing in. Return the chicken and eggs, then add diced onions and carrots. Toss everything together over high heat for 2 minutes. Taste and adjust salt.",
      tip:"Add a few drops of sesame oil right at the end, off the heat, for aromatic depth. It burns easily if cooked too long."
    }
  ]
},

{
  name:"Spaghetti Bolognese",
  category:"dinner",
  ingredients:["Pasta","Ground beef","Tomatoes","Onions","Garlic"],
  simpleSteps:[
    {t:"Boil pasta", a:"soft"},
    {t:"Cook beef", a:"brown"},
    {t:"Add sauce", a:"tomato"},
    {t:"Combine", a:"mix"}
  ],
  chefSteps:[
    {
      t:"Build your soffritto base",
      a:"Finely dice the onions and mince the garlic. Cook them in olive oil over medium-low heat for 10–12 minutes, stirring occasionally, until completely softened and lightly golden — not browned. This slow cook transforms them from sharp and pungent into sweet and deeply savory. This is the flavor foundation that separates a good bolognese from a great one.",
      tip:"Patience here pays dividends. Rushing the soffritto leaves a raw, one-dimensional base."
    },
    {
      t:"Brown the beef deeply",
      a:"Raise heat to medium-high and add the ground beef in a single layer if possible. Do not stir for the first 3–4 minutes — you want a real sear, not a gray steam. Once a crust develops on the bottom, break it apart and continue browning. Season with salt and pepper. The goal is deeply caramelized, not just gray and cooked. Drain any excess fat if needed, but leave a little for richness.",
      tip:"Use 80/20 ground beef for best flavor. Leaner beef dries out and lacks richness."
    },
    {
      t:"Build and simmer the sauce",
      a:"Add the crushed or diced tomatoes and stir to combine. Bring to a gentle bubble, then reduce to a low simmer. Cook uncovered for at least 25–30 minutes, stirring every few minutes. The sauce should reduce and thicken until it clings to a spoon rather than sliding off watery. Add a small pinch of sugar if the tomatoes taste sharp. Taste and adjust salt.",
      tip:"A splash of whole milk or cream added in the last 5 minutes of simmering mellows acidity and adds silkiness — a classic Italian trick."
    },
    {
      t:"Cook and combine the pasta",
      a:"Boil pasta in heavily salted water (it should taste like mild sea water) until just shy of al dente — about 1 minute less than the package says. Reserve a large mug of pasta water before draining. Add the pasta directly into the sauce and toss over medium heat for 1–2 minutes, adding splashes of pasta water to loosen and emulsify. The starchy water helps the sauce coat every strand.",
      tip:"Never rinse your pasta. The surface starch is what makes sauce stick."
    }
  ]
},

{
  name:"Chicken Tacos",
  category:"dinner",
  ingredients:["Chicken breast","Tortilla","Cheese","Onions","Lime"],
  simpleSteps:[
    {t:"Cook chicken", a:"done"},
    {t:"Warm tortillas", a:"soft"},
    {t:"Assemble tacos", a:"fresh"}
  ],
  chefSteps:[
    {
      t:"Season and cook the chicken",
      a:"Flatten the chicken breasts to an even thickness by pounding with a pan or rolling pin — this ensures they cook evenly without drying out. Season both sides generously with salt, pepper, cumin, and a pinch of paprika. Heat a cast iron or heavy skillet over medium-high until very hot. Cook 4–5 minutes per side without moving, then rest for 5 minutes before slicing. Resting is critical — cutting too early loses all the juices.",

    {
      t:"Char the tortillas",
      a:"Place corn tortillas directly over a gas burner flame (or in a dry cast iron pan over high heat) and char for 15–20 seconds per side — you want small blackened spots and a slight puff. This adds smoky flavor and texture that a microwave simply can't replicate. Stack them in a folded kitchen towel or foil as you go to keep them warm and pliable.",

    },
    {
      t:"Build and finish with lime",
      a:"Layer sliced chicken on the tortilla, then add finely diced raw onion (soaked in cold water for 5 minutes to mellow the sharpness, then drained), shredded cheese, and any other toppings. Finish with a generous squeeze of fresh lime over the entire taco just before eating — the acid brightens every other flavor and cuts through the richness of the cheese and chicken.",

},

{
  name:"Garlic Butter Shrimp Pasta",

    {t:"Boil pasta", a:"done"},
    {t:"Cook shrimp", a:"pink"},

  chefSteps:[
    {
      t:"Prep the shrimp properly",
      a:"Pat the shrimp completely dry with paper towels — moisture is the enemy of a good sear. Season with salt, pepper, and a pinch of red pepper flakes. If they have shells, peel them but save the shells — you can briefly sauté them in butter for 2 minutes then remove them to infuse incredible shrimp flavor into your sauce.",

    {
      t:"Cook pasta and reserve water",
      a:"Cook pasta in generously salted boiling water until 1 minute shy of al dente — it will finish in the sauce. Before draining, scoop out a full cup of starchy pasta water. This cloudy, salty, starchy liquid is liquid gold — it's what turns butter and garlic into a silky, emulsified sauce that clings to every strand.",

    {
      t:"Make the garlic butter sauce",
      a:"In a wide skillet over medium heat, melt butter slowly until it foams. Add thinly sliced garlic and cook 60–90 seconds until fragrant and just barely golden — watch carefully as garlic burns fast and turns bitter. Add a splash of pasta water and swirl the pan to start emulsifying the butter into a sauce.",

    {

},

{

  chefSteps:[
    {

    {
      t:"Stir fry the vegetables",

      tip:"Bright green means perfect. Dull olive-green means overcooked. Pull it a little early — it keeps cooking off the heat."
    },
    {
      t:"Sauce and serve over rice",
      a:"Bring the beef back into the center with the vegetables. Pour the soy sauce around the hot edges of the pan so it sizzles and caramelizes, then toss everything to coat, scraping up the browned bits from the bottom. Cook 1 more minute until the sauce clings and nothing is watery. Taste and adjust — a splash more soy for salt, or a pinch of sugar to balance. Spoon over hot rice immediately.",

    }
  ]

/* ---------- BREAKFAST ---------- */

{
  name:"Fluffy Pancakes",
  category:"breakfast",
  ingredients:["Flour","Eggs","Milk","Sugar","Baking soda","Butter","Vinegar"],

      tip:"Save a spoonful of the bacon fat to scramble the eggs in. Free flavor."
    },
    {
      t:"Scramble eggs in bacon fat",
      a:"Pour off most of the fat, leaving about a teaspoon. Over medium-low heat, add beaten eggs and stir slowly with a spatula, making big soft curds. Pull them off the heat while they still look slightly wet. Fold in shredded cheddar so it melts from the leftover heat.",
      tip:"Eggs keep cooking after they leave the pan. If they look done in the pan, they'll be dry on the plate."
    },
    {
      t:"Char tortillas and build",
      a:"Warm tortillas in a dry pan over high heat for 20–30 seconds per side until a few spots char and they puff slightly. Fill with eggs and chopped bacon, then finish with a few dashes of hot sauce.",
      tip:"Two small tortillas stacked together hold heavy fillings without tearing."
    }
  ]
},

{

  category:"breakfast",
  ingredients:["Eggs","Mushrooms","Cheese","Butter","Onions"],
  simpleSteps:[

    {t:"Pour eggs", a:"swirl"},
    {t:"Add filling", a:"cheese"},
    {t:"Fold", a:"serve"}
  ],
  chefSteps:[
    {
      t:"Brown the filling first",
      a:"Slice mushrooms and finely dice a little onion. Cook in butter over medium-high heat without stirring for 2 minutes so the mushrooms brown, then stir and cook 3 more minutes until golden. Season with salt only at the end. Salting early pulls water out and they steam instead of browning. Set aside.",
      tip:"Never put raw vegetables in an omelette. They release water and make the eggs soggy."
    },
    {
      t:"Cook the eggs gently",
      a:"Beat 3 eggs with a pinch of salt until fully blended. Melt butter in a nonstick pan over medium-low heat. Pour in the eggs, then stir in small circles with a spatula while shaking the pan for 20 seconds to form tiny curds. Stop stirring and let the bottom set into a smooth layer while the top is still slightly runny.",
      tip:"Medium-low heat gives a tender, pale omelette. High heat makes it brown and rubbery."
    },
    {
      t:"Fill and fold",
      a:"Spread the mushrooms and cheese over one half. Let it sit 30 seconds for the cheese to start melting, then fold the empty half over the filling with your spatula and slide it onto a plate.",
      tip:"Tilt the pan toward the plate and let the omelette roll out. It does most of the folding for you."
    }
  ]
},

{
  name:"Avocado Toast with Egg",
  category:"breakfast",
  ingredients:["Bread","Avocado","Eggs","Lemon","Salt","Pepper"],
  simpleSteps:[
    {t:"Toast bread", a:"crispy"},

    {t:"Stack it", a:"serve"}
  ],
  chefSteps:[
    {

      tip:"Thin, lightly toasted bread goes soggy under avocado within a minute."
    },
    {
      t:"Season the avocado well",
      a:"Mash a ripe avocado with a fork, leaving some chunks for texture. Squeeze in fresh lemon juice and add a good pinch of salt and pepper. Taste it. Avocado on its own is bland and needs more salt than you'd expect.",
      tip:"The lemon also keeps the avocado bright green instead of turning brown."
    },
    {
      t:"Fry a crispy-edged egg",
      a:"Heat oil in a pan over medium-high until it shimmers. Crack in an egg. The edges should bubble and crisp up right away. Spoon some hot oil over the white to set it while keeping the yolk runny, about 2 minutes total. Slide it on top of the avocado toast and crack pepper over it.",
      tip:"A runny yolk acts like a sauce. Cut into it right before eating."
    }
  ]
},

{
  name:"Banana Cinnamon Oatmeal",

  ingredients:["Oats","Milk","Bananas","Honey","Cinnamon"],

    {t:"Top", a:"honey + cinnamon"}

  chefSteps:[

      tip:"Toasted oats also hold their texture better and don't turn into paste."
    },
    {
      t:"Simmer with milk and banana",
      a:"Pour in 2 cups of milk and a pinch of salt. Mash half a banana and stir it in along with ½ teaspoon cinnamon. Simmer on low for 5 minutes, stirring often, until thick and creamy. The banana melts in and sweetens the oatmeal naturally.",
      tip:"A pinch of salt makes sweet oatmeal taste sweeter. Don't skip it."
    },
    {
      t:"Finish with fresh toppings",
      a:"Spoon into bowls and top with slices from the other half of the banana, a drizzle of honey and a dusting of cinnamon. Add a splash of cold milk on top if you like it looser.",
      tip:"Oatmeal thickens as it sits. Take it off the heat when it's a little looser than you want."
    }
  ]
},

{
  name:"Crispy Breakfast Potatoes",

  ingredients:["Potatoes","Onions","Bell peppers","Paprika","Oil"],
  simpleSteps:[

    {
      t:"Fry undisturbed",

    },
    {
      t:"Add vegetables and season",
      a:"Add diced onions and bell peppers and cook 4–5 minutes until soft with browned edges. Season with salt, pepper and a generous sprinkle of paprika and toss well. Taste and add more salt if needed.",
      tip:"Add the paprika at the end. It burns quickly and turns bitter if it cooks too long."

  ]
},

{

{
  name:"Banana Bread",
  category:"breakfast",
  ingredients:["Bananas","Flour","Sugar","Eggs","Butter","Baking soda","Cinnamon"],
  simpleSteps:[

    {t:"Cool", a:"slice"}
  ],

    },
    {

      a:"Sprinkle 1 teaspoon baking soda, ½ teaspoon cinnamon and a pinch of salt over the wet mixture and stir in. Add 1½ cups flour and fold gently with a spatula just until no dry streaks remain.",

    },
    {
      t:"Bake and cool completely",
      a:"Pour into the pan and bake 55–65 minutes, until a toothpick in the center comes out clean or with a few moist crumbs. Cool in the pan 10 minutes, then turn out onto a rack. Let it cool at least 30 more minutes before slicing so the center finishes setting.",

{

{
  name:"Biscuits & Sausage Gravy",
  category:"breakfast",
  ingredients:["Flour","Butter","Milk","Sausage","Baking soda","Lemon"],
  simpleSteps:[

    {t:"Make gravy", a:"creamy"}
  ],
  chefSteps:[
    {
      t:"Make cold-butter biscuit dough",
      a:"Heat the oven to 425°F. Stir 1 tablespoon lemon juice into ¾ cup cold milk. Mix 2 cups flour, 1 teaspoon baking soda and ½ teaspoon salt. Cut 6 tablespoons very cold butter into small pieces and rub it into the flour with your fingers until it looks like coarse crumbs with some pea-sized bits. Stir in the soured milk just until a shaggy dough forms.",
      tip:"Cold butter is the secret. It melts in the oven and creates steam pockets that make flaky layers."
    },
    {
      t:"Fold, cut and bake",
      a:"Pat the dough into a rectangle, fold it in half, and pat it out again. Repeat twice to build layers. Pat to 1 inch thick, cut into squares or rounds, and place them touching on a baking sheet. Bake 12–15 minutes until tall and golden.",

    },
    {
      t:"Make the sausage gravy",
      a:"Brown ½ pound sausage in a skillet, breaking it up. Sprinkle 3 tablespoons flour over the sausage and its fat and stir for 1–2 minutes to cook out the raw flour taste. Slowly pour in 2 cups milk while stirring. Simmer 3–5 minutes until thick. Season with lots of black pepper and salt. Spoon over split biscuits.",
      tip:"Gravy thickens as it cools. If it gets too thick, stir in a splash more milk."
    }
  ]
},

{

    },
    {
      t:"Butter-toast the bread",

    },

function openPantry(){
  const html = `
    <div class="header">🧺 My Pantry</div>
    <div class="modeBadge" id="pantryCount"></div>
    <label for="scanInput" class="btn btn-chef" style="display:block;margin-top:0;margin-bottom:10px;">📷 Scan my food with camera</label>
    <input type="file" id="scanInput" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;" onchange="scanPhoto(this)">
    <div id="scanArea"></div>
    <input class="searchInput" id="pantrySearch" placeholder="Search ingredients..." oninput="renderPantryList(this.value)">
    <div id="pantryList"></div>
    <div class="btn" onclick="showMatches()">🍳 Find Recipes</div>
    <div class="btn btn-feedback" onclick="clearPantry()">🗑️ Clear Pantry</div>`;
  document.getElementById("pantry").innerHTML = html;
  renderPantryList("");
  updatePantryCount();
  show("pantry");
}

function renderPantryList(filter){
  const f = (filter || "").toLowerCase();
  const list = ingredientItems.filter(i => i.toLowerCase().includes(f));
  let html = "";
  if(list.length === 0){
    html = `<div class="card" style="text-align:center;opacity:0.6;">No ingredients match "${filter}"</div>`;
  }
  list.forEach(name => {
    const on = selected.includes(name);
    html += `<div class="item${on ? " selected" : ""}" data-name="${name}" onclick="toggleIngredient(this)">${on ? "✅" : "⬜"} ${name}</div>`;
  });
  document.getElementById("pantryList").innerHTML = html;
}

function toggleIngredient(el){
  const name = el.dataset.name;
  if(selected.includes(name)){
    selected = selected.filter(s => s !== name);
    el.classList.remove("selected");
    el.textContent = "⬜ " + name;
  } else {
    selected.push(name);
    el.classList.add("selected");
    el.textContent = "✅ " + name;
  }
  storeSet("ingredients", JSON.stringify(selected));
  updatePantryCount();
}

/* ================= CAMERA SCAN =================
   Uses two free AI models that run right in the browser (no account, no key):
   - COCO-SSD finds separate objects in the photo
   - MobileNet names what each object (and each part of the photo) looks like
   They only know some foods, so the user confirms results before adding. */

const SCAN_LIBS = [
  "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js",
  "https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js",
  "https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"
];

// What the AI calls it -> your pantry ingredient name
const SCAN_WORDS = {
  "banana":"Bananas", "broccoli":"Broccoli", "carrot":"Carrots",
  "bell pepper":"Bell peppers", "mushroom":"Mushrooms", "agaric":"Mushrooms", "bolete":"Mushrooms",
  "lemon":"Lemon", "french loaf":"Bread", "bagel":"Bread", "sandwich":"Bread",
  "guacamole":"Avocado", "mashed potato":"Potatoes", "hotdog":"Sausage", "hot dog":"Sausage",
  "burrito":"Tortilla", "chocolate sauce":"Chocolate", "honeycomb":"Honey",
  "meat loaf":"Ground beef", "cheeseburger":"Ground beef", "carbonara":"Pasta",
  "coho":"Salmon", "milk can":"Milk"
};

let scanModels = null;
let scanFound = [];

function loadScript(src){
  return new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = src; el.onload = res; el.onerror = () => rej(new Error("load failed"));
    document.head.appendChild(el);
  });
}

async function getScanModels(){
  if(scanModels) return scanModels;
  // Give up after 45 seconds instead of spinning forever (e.g. no internet or a blocked viewer)
  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 45000));
  const load = (async () => {
    for(const src of SCAN_LIBS) await loadScript(src);
    const [net, det] = await Promise.all([mobilenet.load({version:2, alpha:1.0}), cocoSsd.load()]);
    return {net, det};
  })();
  scanModels = await Promise.race([load, timeout]);
  return scanModels;
}

function scanStatus(html){
  const area = document.getElementById("scanArea");
  if(area) area.innerHTML = html;
}

function toPantryName(label){
  const l = label.toLowerCase();
  for(const word in SCAN_WORDS){
    if(l.includes(word) && ingredientItems.includes(SCAN_WORDS[word])) return SCAN_WORDS[word];
  }
  return null;
}

function cropCanvas(src, x, y, w, h){
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
  c.getContext("2d").drawImage(src, x, y, w, h, 0, 0, c.width, c.height);
  return c;
}

// Claude vision: available when the app is opened from its claude.ai link
async function getClaudeVision(){
  try{
    if(!window.claude || typeof window.claude.use !== "function") return null;
    const s = await window.claude.use("sample");
    if(!s) return null;
    const lim = await s.limits().catch(() => null);
    return lim && lim.images ? s : null;
  }catch(e){ return null; }
}

function canvasToBlob(c){
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
}

function resizeTo(img, maxSide){
  const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}

const CLAUDE_ERRORS = {
  not_granted: "Claude wasn't allowed to look at photos. Tap ingredients below instead, or reopen the app and choose Allow.",
  rate_limited: "Too many scans right now. Wait a minute and try again.",
  image_rejected: "That photo couldn't be read. Try a different picture.",
  session_expired: "Please sign in to Claude again, then try another scan."
};

async function scanPhoto(input){
  const file = input.files && input.files[0];
  input.value = "";
  if(!file) return;

  const url = URL.createObjectURL(file);
  const preview = `<img src="${url}" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:8px;">`;
  const busy = msg => scanStatus(`<div class="card">${preview}<div style="text-align:center;">🔥 ${msg}</div></div>`);
  busy("Getting ready...");

  let img;
  try{
    img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  }catch(e){
    scanStatus(`<div class="card" style="text-align:center;">😕 That photo couldn't be opened. Try another one.</div>`);
    return;
  }

  // ---- Option A: Claude looks at the photo (smart: reads labels, many items at once)
  const vision = await getClaudeVision();
  if(vision){
    busy("Claude is looking at your food... (can take up to a minute)");
    try{
      const blob = await canvasToBlob(resizeTo(img, 1280));
      const prompt =
        "This photo shows someone's food at home (fridge, pantry, cupboard, counter or groceries). " +
        "List every ingredient from the list below that you can see in the photo. Count packaged items " +
        "when you can tell what they are from the label, bottle or box. Don't guess at things you can't see.\n\n" +
        "Allowed names (copy them exactly): " + JSON.stringify(ingredientItems) + "\n\n" +
        'Reply with only a JSON array of matching names, for example ["Eggs","Milk"]. Reply [] if none are visible.';
      const answer = await vision.json(prompt, { images: [blob] });
      const lookup = {};
      ingredientItems.forEach(n => lookup[n.toLowerCase()] = n);
      const found = new Set();
      (Array.isArray(answer) ? answer : []).forEach(a => {
        const n = lookup[String(a).trim().toLowerCase()];
        if(n) found.add(n);
      });
      scanFound = [...found];
      showScanResults(preview, true);
    }catch(e){
      const msg = CLAUDE_ERRORS[e && e.code] || "The scan didn't finish. Try again in a moment.";
      scanStatus(`<div class="card">${preview}<div style="text-align:center;">😕 ${msg}</div>
        <div class="btn" onclick="scanStatus('')" style="padding:10px;">OK</div></div>`);
    }
    return;
  }

  // ---- Option B: basic AI that runs in the browser (works outside Claude)
  busy(scanModels ? "Looking at your food..." : "Loading the AI (first scan only, takes a moment)...");
  try{
    const small = resizeTo(img, 640);
    const {net, det} = await getScanModels();
    busy("Looking at your food...");

    const found = new Set();
    const W = small.width, H = small.height;

    const objects = await det.detect(small, 20, 0.3);
    for(const o of objects){
      const hit = toPantryName(o.class);
      if(hit && o.score >= 0.4) found.add(hit);
      const [x, y, w, h] = o.bbox;
      if(w > 20 && h > 20){
        const guesses = await net.classify(cropCanvas(small, x, y, w, h), 3);
        guesses.forEach(g => { const n = toPantryName(g.className); if(n && g.probability >= 0.2) found.add(n); });
      }
    }

    const regions = [[0,0,W,H],[0,0,W/2,H/2],[W/2,0,W/2,H/2],[0,H/2,W/2,H/2],[W/2,H/2,W/2,H/2]];
    for(const [x, y, w, h] of regions){
      const guesses = await net.classify(cropCanvas(small, x, y, w, h), 5);
      guesses.forEach(g => { const n = toPantryName(g.className); if(n && g.probability >= 0.15) found.add(n); });
    }

    scanFound = [...found];
    showScanResults(preview, false);
  } catch(e){
    scanModels = null;
    scanStatus(`<div class="card" style="text-align:center;">😕 The scanner couldn't load. It needs internet and a regular browser (Chrome or Safari). App previews block it.<br><small style="opacity:.6">You can still tap ingredients below.</small></div>`);
  }
}

function showScanResults(preview, usedClaude){
  if(scanFound.length === 0){
    scanStatus(`<div class="card">${preview}<div style="text-align:center;">🤔 I didn't recognize anything.<br><small style="opacity:.6">Try one item at a time in good light, or tap ingredients below.</small></div>
      <div class="btn" onclick="scanStatus('')" style="padding:10px;">OK</div></div>`);
    return;
  }
  let html = `<div class="card">${preview}<b>I spotted:</b><small style="opacity:.6;display:block;margin-bottom:6px;">Tap to uncheck anything that's wrong.</small>`;
  scanFound.forEach(name => {
    const have = selected.includes(name);
    html += `<div class="item selected" data-name="${name}" onclick="this.classList.toggle('selected');this.firstChild.textContent=this.classList.contains('selected')?'✅ ':'⬜ '"><span>✅ </span>${name}${have ? ' <small style="opacity:.6">(already in pantry)</small>' : ""}</div>`;
  });
  html += `<div class="btn btn-chef" onclick="addScanned()">Add to pantry</div>
    <div class="btn btn-feedback" onclick="scanStatus('')" style="padding:10px;">Cancel</div>
    <small style="opacity:.55;display:block;margin-top:8px;">${usedClaude
      ? "Scanned by Claude. Anything it missed, tap in the list below."
      : "The basic scanner knows fresh foods best (bananas, broccoli, carrots, peppers, mushrooms, lemons, bread). Packaged items like sauces and spices need to be tapped below."}</small></div>`;
  scanStatus(html);
}

function addScanned(){
  document.querySelectorAll("#scanArea .item.selected").forEach(el => {
    const n = el.dataset.name;
    if(!selected.includes(n)) selected.push(n);
  });
  storeSet("ingredients", JSON.stringify(selected));
  scanStatus("");
  renderPantryList(document.getElementById("pantrySearch").value);
  updatePantryCount();
}

function updatePantryCount(){
  const el = document.getElementById("pantryCount");
  if(el) el.textContent = `${selected.length} ingredient${selected.length === 1 ? "" : "s"} selected`;
}

/* ================= RECIPE LIST ================= */
function showMatches(){
  const cats = ["all", ...new Set(recipes.map(r => r.category).filter(Boolean))];
  let html = `<div class="header">🍳 Recipes</div>`;

  html += `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:6px;">`;
  cats.forEach(c => {
    const on = c === recipeFilter;
    html += `<div class="item${on ? " selected" : ""}" style="margin:0;padding:6px 14px;text-transform:capitalize;" onclick="setFilter('${c}')">${c}</div>`;
  });
  html += `</div>`;

  if(selected.length === 0){
    html += `<div class="modeBadge">Tip: add ingredients in your Pantry to see your best matches first.</div>`;
  }

  const list = recipes
    .map((r, i) => ({r, i, m: matchCount(r)}))
    .filter(x => recipeFilter === "all" || x.r.category === recipeFilter)
    .sort((a, b) => (b.m / b.r.ingredients.length) - (a.m / a.r.ingredients.length));

  list.forEach(({r, i, m}) => {
    const total = r.ingredients.length;
    const missing = r.ingredients.filter(x => !selected.includes(x));
    const pct = Math.round(m / total * 100);
    const fav = favorites.includes(r.name) ? `<span class="fav-badge">★ Saved</span>` : "";
    html += `
      <div class="card" onclick="openRecipe(${i})" style="cursor:pointer;">
        <b>${r.name}</b>${fav}<br>
        <small style="opacity:0.7">Match: ${m}/${total} (${pct}%)${r.category ? " · " + r.category : ""}</small>
        <div style="height:6px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:8px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:${pct === 100 ? "#4ade80" : "#4facfe"};"></div>
        </div>
        ${missing.length ? `<small style="opacity:0.55;display:block;margin-top:6px;">Missing: ${missing.join(", ")}</small>`
                         : `<small style="color:#4ade80;display:block;margin-top:6px;">You have everything! 🎉</small>`}
      </div>`;
  });

  document.getElementById("results").innerHTML = html;
  show("results");
}

function setFilter(c){
  recipeFilter = c;
  showMatches();
}

/* ================= SHOPPING ================= */
function shopUrl(name){
  return "https://www.walmart.com/search?q=" + encodeURIComponent(name);
}


/* ================= SINGLE RECIPE ================= */
function openRecipe(i){
  currentRecipe = i;
  chefMode = true;
  renderRecipe();
  document.getElementById("recipe").scrollTop = 0;
  show("recipe");
}

function setMode(chef){
  chefMode = chef;
  renderRecipe();
}

function renderRecipe(){
  const r = recipes[currentRecipe];
  if(!r) return;
  const isFav = favorites.includes(r.name);
  const missing = r.ingredients.filter(x => !selected.includes(x));

  let html = `
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div class="btn" onclick="showMatches()" style="margin-top:0;padding:8px 14px;">← Back</div>
      <span class="fav-star${isFav ? " saved" : ""}" onclick="toggleFavorite(${currentRecipe})">★</span>
    </div>
    <div class="recipeTitle" style="margin-top:14px;">${r.name}</div>

    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <div class="btn btn-chef" onclick="setMode(true)" style="flex:1;margin-top:0;${chefMode ? "" : "opacity:.45;"}">👨‍🍳 Chef Mode</div>
      <div class="btn" onclick="setMode(false)" style="flex:1;margin-top:0;${chefMode ? "opacity:.45;" : ""}">🍽️ Simple</div>
    </div>

    <div class="card">
      <b>Ingredients</b>
      ${missing.length ? `<small style="opacity:.6;display:block;margin-top:4px;">Tap 🛒 to buy what you're missing at Walmart</small>` : ""}
      ${r.ingredients.map(x => selected.includes(x)
        ? `<div style="margin-top:8px;">✅ ${x}</div>`
        : `<div style="margin-top:8px;display:flex;align-items:center;justify-content:space-between;">
             <span>❌ ${x}</span>
             <a target="_blank" href="${shopUrl(x)}" style="background:#0071ce;color:white;text-decoration:none;font-weight:700;font-size:13px;padding:6px 12px;border-radius:20px;">🛒 Buy</a>
           </div>`).join("")}
    </div>`;

  if(chefMode && r.chefSteps){
    html += `
      <div class="chef-banner">
        <div class="chef-banner-title">🔥 CHEF MODE 🔥</div>
        <div class="chef-banner-sub">Detailed technique + pro tips</div>
      </div>`;
    r.chefSteps.forEach((s, n) => {
      html += `
        <div class="chef-card">
          <div class="step-header"><span class="step-number">${n + 1}</span><span class="step-title" style="margin-bottom:0;">${s.t}</span></div>
          <div class="step-body">${s.a}</div>
          ${s.tip ? `<div class="step-tip">💡 ${s.tip}</div>` : ""}
        </div>`;
    });
  } else {
    r.simpleSteps.forEach((s, n) => {
      html += `
        <div class="card" style="display:flex;align-items:center;">
          <span class="step-number" style="background:#4facfe;">${n + 1}</span>
          <div><b>${s.t}</b> <span style="opacity:.6">— ${s.a}</span></div>
        </div>`;
    });
  }

  document.getElementById("recipe").innerHTML = html;
}

</script>
</body>
</html>
