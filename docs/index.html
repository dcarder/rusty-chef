<script>

/* ================= NAV ================= */
function show(id){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  requestAnimationFrame(() => document.getElementById(id).classList.add("active"));
}

/* ================= INGREDIENTS ================= */
let ingredientItems = []; // filled in automatically from the recipes below

function storeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function storeSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function loadList(k){ try{ const v = JSON.parse(storeGet(k) || "[]"); return Array.isArray(v) ? v : []; }catch(e){ return []; } }

let selected = loadList("ingredients");
let favorites = loadList("favorites");

function toggleFavorite(idx){
  const name = typeof idx === "number" ? recipes[idx].name : idx;
  favorites = favorites.includes(name) ? favorites.filter(f=>f!==name) : [...favorites, name];
  storeSet("favorites", JSON.stringify(favorites));
  const star = document.querySelector('.fav-star');
  const isFav = favorites.includes(name);
  if(star){
    if(isFav){
      star.classList.add('saved');
      star.style.transform = 'scale(1.5)';
      setTimeout(() => star.style.transform = '', 200);
    } else {
      star.classList.remove('saved');
    }
  }
}

function showFavorites(){
  let html = `<div class="header">⭐ Saved Recipes</div>`;
  if(favorites.length === 0){
    html += `<div class="card" style="text-align:center;opacity:0.6;padding:30px;">
      No saved recipes yet.<br><br>Tap ⭐ on any recipe to save it here.
    </div>`;
  } else {
    favorites.forEach(name => {
      const r = recipes.find(x => x.name === name);
      if(!r) return;
      const match = r.ingredients.filter(i => selected.includes(i)).length;
      html += `
        <div class="card" style="display:flex;align-items:center;gap:12px;cursor:pointer;" onclick="openRecipe(${recipes.findIndex(x=>x.name===name)})">
          ${photoImg(name, "thumb small", 150)}
          <div style="flex:1;min-width:0;"><b>${name}</b><br><small style="opacity:0.6">Match: ${match}/${r.ingredients.length}</small></div>
          <span style="font-size:20px;color:#ffd700;">★</span>
        </div>`;
    });
  }
  html += `
    `;
  document.getElementById("favorites").innerHTML = html;
  show("favorites");
}

function clearPantry(){
  selected = [];
  storeSet("ingredients", JSON.stringify(selected));
  openPantry();
}

function photoUrl(name, width){
  const id = recipePhotos[name];
  return id ? `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${width}&q=70` : "";
}

function photoImg(name, cls, width){
  const url = photoUrl(name, width);
  return url ? `<img class="${cls}" src="${url}" alt="${name}" loading="lazy" onerror="this.style.display='none'">` : "";
}

{

  category:"dinner",
  ingredients:["Ground beef","Broccoli","Soy sauce","Carrots","Rice"],
  simpleSteps:[

    {t:"Serve over rice", a:"hot"}

  chefSteps:[
    {
      t:"Prep your vegetables",
      a:"Cut broccoli into small, uniform florets so they cook evenly. Slice carrots on a diagonal — this creates more surface area for browning and looks intentional. Have everything cut, measured, and ready before you turn on the heat. Stir frying moves fast and there's no time to chop mid-cook.",
      tip:"The diagonal cut on carrots isn't just aesthetic — more surface area means faster, more even cooking and better caramelization."

      tip:"Those dark bits stuck to the pan are pure flavor (called fond). Don't scrape them away — the soy sauce will lift them up in the next step."

    {
      t:"Stir fry the vegetables",

    },
    {
      t:"Sauce and serve over rice",

    }
  ]
},

{"name": "Spinach & Mushroom Frittata", "category": "breakfast", "ingredients": ["Eggs", "Spinach", "Mushrooms", "Onions", "Cheese", "Milk", "Butter"], "simpleSteps": [{"t": "Cook veggies", "a": "oven-safe pan"}, {"t": "Whisk eggs", "a": "with milk"}, {"t": "Pour + set edges", "a": "stovetop"}, {"t": "Finish in oven", "a": "until puffed"}], "chefSteps": [{"t": "Cook the vegetables first", "a": "Heat the oven to 400°F. In an oven-safe skillet, melt butter over medium-high. Cook sliced mushrooms and diced onion for 6–7 minutes until the mushrooms are browned. Add spinach and stir for 1 minute until wilted. Season with salt and pepper.", "tip": "Cook out the water from the mushrooms and spinach — wet veggies make a weepy frittata."}, {"t": "Whisk the custard", "a": "Whisk 8 eggs with ¼ cup milk, a pinch of salt and pepper, and half the cheese until smooth.", "tip": "A splash of milk keeps it tender. Too much makes it rubbery and watery."}, {"t": "Start on the stove", "a": "Lower the heat to medium-low, pour in the eggs and gently stir for 30 seconds, then leave it alone for 3–4 minutes until the edges set.", "tip": "Setting the bottom on the stove means a shorter oven time and a creamier center."}, {"t": "Finish in the oven", "a": "Sprinkle the rest of the cheese on top and bake 10–12 minutes until just set in the middle and lightly puffed. Rest 5 minutes, then slice into wedges.", "tip": "Pull it when the center barely jiggles. It keeps cooking as it rests."}]},
{"name": "Veggie Western Omelette", "category": "breakfast", "ingredients": ["Eggs", "Bell peppers", "Onions", "Cheddar", "Butter", "Tomatoes"], "simpleSteps": [{"t": "Sauté veggies", "a": "peppers, onion"}, {"t": "Whisk eggs", "a": "well"}, {"t": "Cook omelette", "a": "low heat"}, {"t": "Fill + fold", "a": "cheese melts"}], "chefSteps": [{"t": "Soften the filling", "a": "Dice bell pepper and onion small. Cook in a little butter over medium heat for 4–5 minutes until soft and sweet. Add diced tomato for the last minute. Season and move to a plate.", "tip": "Cut the veggies small so they fit in the fold and cook fast."}, {"t": "Beat the eggs hard", "a": "Whisk 3 eggs with a pinch of salt for a full 30 seconds until no streaks of white remain and they look frothy.", "tip": "Air in the eggs means a fluffier omelette."}, {"t": "Cook low and gentle", "a": "Wipe the pan, add a pat of butter over medium-low. Pour in the eggs and stir with a spatula for 20 seconds, then let them set for 1–2 minutes, tilting the pan so raw egg runs to the edges.", "tip": "High heat makes a brown, rubbery omelette. Low heat keeps it soft and yellow."}, {"t": "Fill and fold", "a": "When the top is still slightly glossy, add the veggies and shredded cheddar to one half. Fold over, cover for 30 seconds to melt the cheese, and slide onto a plate.", "tip": "A lid traps steam and melts the cheese without overcooking the outside."}]},
{"name": "Breakfast Quesadilla", "category": "breakfast", "ingredients": ["Tortilla", "Eggs", "Cheese", "Bacon", "Green onions", "Butter"], "simpleSteps": [{"t": "Cook bacon", "a": "crispy"}, {"t": "Soft scramble", "a": "eggs"}, {"t": "Fill tortilla", "a": "cheese both sides"}, {"t": "Toast", "a": "golden, flip"}], "chefSteps": [{"t": "Crisp the bacon", "a": "Cook 3 strips of bacon in a skillet over medium for 7–8 minutes until crisp. Drain on paper towel and chop. Pour off most of the fat.", "tip": "Start bacon in a cold pan so the fat renders slowly and the strips cook evenly."}, {"t": "Soft-scramble the eggs", "a": "Whisk 3 eggs with salt. Cook in the same pan over low heat, stirring slowly, for 2 minutes until just barely set and still glossy. Remove right away.", "tip": "They'll cook more inside the quesadilla, so pull them early."}, {"t": "Build with cheese on both sides", "a": "Lay a tortilla in the pan with a little butter. Sprinkle cheese on half, add eggs, bacon and green onions, then more cheese on top. Fold over.", "tip": "Cheese on top and bottom acts like glue and holds the filling together when you cut it."}, {"t": "Toast until crisp", "a": "Cook over medium 2–3 minutes per side, pressing gently with a spatula, until golden and the cheese is melted. Cut into wedges.", "tip": "Serve with hot sauce or sour cream for dipping."}]},
{"name": "Blueberry Muffins", "category": "breakfast", "ingredients": ["Flour", "Sugar", "Eggs", "Milk", "Butter", "Blueberries", "Baking soda", "Vanilla extract", "Greek yogurt"], "simpleSteps": [{"t": "Mix dry", "a": "flour, sugar, soda"}, {"t": "Mix wet", "a": "butter, eggs, yogurt"}, {"t": "Fold + berries", "a": "don't overmix"}, {"t": "Bake", "a": "400°F"}], "chefSteps": [{"t": "Mix the batter", "a": "Heat the oven to 400°F and line a muffin tin. Whisk 2 cups flour, ¾ cup sugar, 1 tsp baking soda and ½ tsp salt. In another bowl whisk ½ cup melted butter, 2 eggs, ½ cup Greek yogurt, ½ cup milk and 1 tsp vanilla.", "tip": "The tangy yogurt reacts with the baking soda to give tall, tender muffins."}, {"t": "Fold gently", "a": "Pour the wet into the dry and fold with a spatula until just combined. Toss 1½ cups blueberries with a spoonful of flour, then fold them in.", "tip": "Coating berries in flour stops them from sinking to the bottom."}, {"t": "Fill high and bake hot", "a": "Fill the cups all the way to the top. Sprinkle a little sugar on each. Bake 5 minutes at 400°F, then lower to 350°F and bake 15–17 minutes more, until a toothpick comes out clean.", "tip": "The blast of high heat makes bakery-style domed tops."}, {"t": "Cool in the tin", "a": "Let the muffins sit in the tin for 5 minutes, then move to a rack so the bottoms don't steam and go soggy.", "tip": "Frozen blueberries work too — add them straight from the freezer."}]},
{"name": "Cinnamon French Toast Sticks", "category": "breakfast", "ingredients": ["Bread", "Eggs", "Milk", "Cinnamon", "Sugar", "Butter", "Vanilla extract", "Maple syrup"], "simpleSteps": [{"t": "Cut bread", "a": "into sticks"}, {"t": "Dip", "a": "egg + milk"}, {"t": "Fry", "a": "butter, golden"}, {"t": "Roll", "a": "cinnamon sugar"}], "chefSteps": [{"t": "Use day-old bread", "a": "Cut thick slices of slightly stale bread into 1-inch sticks. Dry bread soaks up custard without falling apart.", "tip": "Fresh bread? Toast the sticks in a 300°F oven for 8 minutes to dry them out."}, {"t": "Make the custard", "a": "Whisk 3 eggs, ¾ cup milk, 1 tsp vanilla and ½ tsp cinnamon in a shallow dish.", "tip": "Whisk until no streaks of egg white remain, or you'll get patches of cooked egg."}, {"t": "Dip quickly and fry", "a": "Dip each stick for 2–3 seconds per side. Fry in butter over medium heat for 2 minutes per side until golden on all sides.", "tip": "A quick dip keeps the inside custardy, not soggy."}, {"t": "Roll in cinnamon sugar", "a": "Mix ¼ cup sugar with 1 tsp cinnamon. Roll the hot sticks in it right away so it sticks. Serve with maple syrup for dipping.", "tip": "Kids love these. They also freeze well — reheat in a toaster oven."}]},
{"name": "Chilaquiles", "category": "breakfast", "ingredients": ["Tortilla", "Tomatoes", "Onions", "Jalapeño", "Garlic", "Eggs", "Cheese", "Sour cream", "Cilantro"], "simpleSteps": [{"t": "Crisp tortillas", "a": "cut + bake"}, {"t": "Blend sauce", "a": "tomato, chile"}, {"t": "Toss + simmer", "a": "1 minute"}, {"t": "Top", "a": "fried egg, cheese"}], "chefSteps": [{"t": "Make tortilla chips", "a": "Heat the oven to 400°F. Cut tortillas into wedges, toss with a little oil and salt, and bake 10–12 minutes, flipping once, until crisp.", "tip": "Homemade chips hold up in the sauce much better than thin bagged chips."}, {"t": "Make a quick red sauce", "a": "Blend 3 tomatoes, ¼ onion, 1 jalapeño and 2 garlic cloves until smooth. Simmer in a skillet with a little oil for 8–10 minutes until it darkens and thickens. Season with salt.", "tip": "Frying the sauce in hot oil deepens the flavor — that's the secret of good Mexican sauces."}, {"t": "Toss and serve fast", "a": "Add the chips to the sauce and toss for 1 minute, just until coated but still a little crunchy.", "tip": "Chilaquiles wait for no one — serve them right away."}, {"t": "Pile on the toppings", "a": "Top with fried eggs, crumbled or shredded cheese, sour cream, sliced onion and cilantro.", "tip": "Runny yolk mixing into the sauce is the best part."}]},
{"name": "Breakfast Burrito Bowl", "category": "breakfast", "ingredients": ["Potatoes", "Eggs", "Sausage", "Beans", "Cheese", "Avocado", "Sour cream", "Green onions"], "simpleSteps": [{"t": "Crisp potatoes", "a": "diced"}, {"t": "Brown sausage", "a": "crumbled"}, {"t": "Scramble eggs", "a": "soft"}, {"t": "Build bowl", "a": "beans, avocado"}], "chefSteps": [{"t": "Crisp the potatoes", "a": "Dice potatoes into ½-inch cubes. Microwave 3 minutes to par-cook, then fry in oil over medium-high for 8–10 minutes until golden and crisp. Season with salt, pepper and a pinch of paprika.", "tip": "The microwave head start cuts the frying time in half."}, {"t": "Brown the sausage", "a": "Crumble sausage into a skillet over medium-high and cook 6–7 minutes until browned and cooked through. Warm the beans in a small pot.", "tip": "Let the sausage sit without stirring for the first 2 minutes to get crispy bits."}, {"t": "Soft scramble", "a": "Scramble the eggs over low heat with a pat of butter, stirring slowly, until creamy and just set.", "tip": "Take them off the heat a little early — carryover heat finishes them."}, {"t": "Build the bowl", "a": "Layer potatoes, beans, sausage and eggs. Top with cheese, sliced avocado, a spoon of sour cream and green onions.", "tip": "Make the potatoes and sausage ahead for fast weekday bowls."}]},
{"name": "Sausage, Egg & Cheese Wrap", "category": "breakfast", "ingredients": ["Tortilla", "Sausage", "Eggs", "Cheddar", "Hot sauce"], "simpleSteps": [{"t": "Brown sausage", "a": "crumbled"}, {"t": "Scramble eggs", "a": "soft"}, {"t": "Wrap", "a": "cheese + hot sauce"}, {"t": "Toast seam", "a": "seal"}], "chefSteps": [{"t": "Cook the sausage", "a": "Brown ¼ lb crumbled sausage for 5–6 minutes. Drain.", "tip": "Cook a big batch on Sunday for quick wraps all week."}, {"t": "Scramble", "a": "Add 2 beaten eggs to the pan over low heat and stir 1–2 minutes until softly set.", "tip": "Low heat keeps the eggs creamy."}, {"t": "Wrap and toast", "a": "Fill a warm tortilla with the eggs, sausage, cheddar and hot sauce. Roll up and toast seam-side down 1 minute.", "tip": "Wrap in foil to eat on the go."}]},
{"name": "Peanut Butter Banana Oatmeal", "category": "breakfast", "ingredients": ["Oats", "Milk", "Bananas", "Peanut butter", "Honey", "Cinnamon"], "simpleSteps": [{"t": "Mash banana", "a": "in pot"}, {"t": "Add oats + milk", "a": "simmer"}, {"t": "Stir in PB", "a": "creamy"}, {"t": "Top", "a": "banana, honey"}], "chefSteps": [{"t": "Cook banana into the oats", "a": "Mash half a banana in a small pot. Add 1 cup oats, 2 cups milk, a pinch of salt and cinnamon. Bring to a simmer and cook 5 minutes, stirring often, until thick and creamy.", "tip": "A mashed banana sweetens the oats naturally, so you need less sugar."}, {"t": "Swirl in the peanut butter", "a": "Take the pot off the heat and stir in 2 tbsp peanut butter until melted and creamy.", "tip": "Adding the peanut butter at the end keeps its roasted flavor strong."}, {"t": "Top it", "a": "Spoon into bowls, top with the other half of the banana sliced, a drizzle of honey and a little extra peanut butter.", "tip": "Add a pinch of salt on top — it makes the peanut butter taste even nuttier."}]},
{"name": "Blueberry Baked Oatmeal", "category": "breakfast", "ingredients": ["Oats", "Milk", "Eggs", "Blueberries", "Maple syrup", "Baking soda", "Cinnamon", "Butter", "Vanilla extract"], "simpleSteps": [{"t": "Mix dry", "a": "oats, cinnamon"}, {"t": "Mix wet", "a": "milk, egg, syrup"}, {"t": "Combine + berries", "a": "in dish"}, {"t": "Bake", "a": "375°F"}], "chefSteps": [{"t": "Mix the oats", "a": "Heat the oven to 375°F. Stir 2 cups oats, 1 tsp cinnamon, ½ tsp baking soda and a pinch of salt in a bowl.", "tip": "Old-fashioned oats give a chewy, cake-like bake. Quick oats turn mushy."}, {"t": "Add the wet ingredients", "a": "Whisk 1¾ cups milk, 1 egg, ⅓ cup maple syrup, 2 tbsp melted butter and 1 tsp vanilla. Stir into the oats.", "tip": "Let it sit 10 minutes so the oats absorb some liquid before baking."}, {"t": "Bake with berries", "a": "Pour into a greased 8x8 dish and scatter 1 cup blueberries on top. Bake 35–40 minutes until set and golden at the edges.", "tip": "Make it Sunday and cut it into squares for grab-and-go breakfasts all week."}]},
{"name": "Hash Brown Egg Nests", "category": "breakfast", "ingredients": ["Potatoes", "Eggs", "Cheese", "Butter", "Green onions"], "simpleSteps": [{"t": "Grate potatoes", "a": "squeeze dry"}, {"t": "Press into tin", "a": "nest shape"}, {"t": "Bake crisp", "a": "first"}, {"t": "Add eggs", "a": "bake again"}], "chefSteps": [{"t": "Grate and squeeze", "a": "Heat the oven to 425°F. Grate 2 large potatoes, then wrap in a clean towel and squeeze out as much water as you can. Mix with 2 tbsp melted butter, half the cheese, salt and pepper.", "tip": "Squeezing out the water is the key to crispy hash browns. Be aggressive."}, {"t": "Bake the nests", "a": "Press the potato mixture into a well-greased muffin tin, up the sides, to make cups. Bake 15–18 minutes until the edges are deep golden.", "tip": "Grease the tin heavily or they'll stick."}, {"t": "Add eggs and finish", "a": "Crack an egg into each nest, top with remaining cheese, and bake 10–12 minutes until the whites are set. Sprinkle with green onions.", "tip": "For runny yolks, check at 9 minutes."}]},
{"name": "Breakfast Pizza", "category": "breakfast", "ingredients": ["Tortilla", "Eggs", "Bacon", "Mozzarella", "Tomatoes", "Green onions"], "simpleSteps": [{"t": "Crisp tortilla", "a": "in oven"}, {"t": "Add cheese", "a": "+ bacon"}, {"t": "Crack eggs", "a": "on top"}, {"t": "Bake", "a": "until set"}], "chefSteps": [{"t": "Pre-crisp the crust", "a": "Heat the oven to 425°F. Put a large tortilla on a sheet pan, brush with a little oil, and bake 4 minutes until it starts to crisp.", "tip": "Baking the tortilla first stops a soggy middle."}, {"t": "Top it", "a": "Sprinkle mozzarella over the tortilla, leaving a rim. Add chopped cooked bacon and diced tomato. Make two small wells in the cheese.", "tip": "The cheese wall keeps the eggs from sliding off."}, {"t": "Add eggs and bake", "a": "Crack an egg into each well. Bake 8–10 minutes until the whites are set and the cheese is bubbling. Top with green onions, salt and pepper.", "tip": "Add a few drops of hot sauce before serving."}]},
{"name": "Migas", "category": "breakfast", "ingredients": ["Tortilla", "Eggs", "Tomatoes", "Onions", "Jalapeño", "Cheese", "Cilantro"], "simpleSteps": [{"t": "Fry tortilla strips", "a": "crispy"}, {"t": "Add onion + chile", "a": "soften"}, {"t": "Add eggs", "a": "scramble"}, {"t": "Cheese + cilantro", "a": "serve"}], "chefSteps": [{"t": "Fry the tortilla strips", "a": "Cut 3 tortillas into strips. Fry in 2 tbsp oil over medium-high for 3–4 minutes until golden and crisp. Salt them.", "tip": "Stale tortillas fry up crispier than fresh ones."}, {"t": "Cook the aromatics", "a": "Add diced onion and jalapeño to the pan and cook 3 minutes. Add diced tomato and cook 1 minute more.", "tip": "Remove jalapeño seeds for less heat."}, {"t": "Scramble it all", "a": "Lower the heat, pour in 5 beaten eggs, and stir gently for 2 minutes until softly set. Fold in shredded cheese and chopped cilantro.", "tip": "Keep some strips crunchy by adding a handful back on top at the end."}]},
{"name": "Banana Oat Pancakes", "category": "breakfast", "ingredients": ["Oats", "Bananas", "Eggs", "Milk", "Baking soda", "Cinnamon", "Maple syrup"], "simpleSteps": [{"t": "Blend oats", "a": "into flour"}, {"t": "Blend batter", "a": "banana, egg, milk"}, {"t": "Rest", "a": "5 minutes"}, {"t": "Cook", "a": "medium-low"}], "chefSteps": [{"t": "Blend everything", "a": "Blend 1½ cups oats into a fine flour. Add 1 ripe banana, 2 eggs, ½ cup milk, ½ tsp baking soda, ½ tsp cinnamon and a pinch of salt. Blend until smooth.", "tip": "Spottier bananas are sweeter — no sugar needed."}, {"t": "Let it thicken", "a": "Rest the batter 5 minutes. The oats soak up liquid and the batter thickens so the pancakes hold their shape.", "tip": "If it gets too thick, add a splash of milk."}, {"t": "Cook lower than usual", "a": "Cook ¼-cup scoops in a buttered pan over medium-low for 2–3 minutes per side.", "tip": "Banana batter browns fast — lower heat cooks the middle before the outside burns."}]},
{"name": "Spinach & Cheese Scramble", "category": "breakfast", "ingredients": ["Eggs", "Spinach", "Cheese", "Butter", "Garlic", "Bread"], "simpleSteps": [{"t": "Wilt spinach", "a": "with garlic"}, {"t": "Add eggs", "a": "low heat"}, {"t": "Fold in cheese", "a": "off heat"}, {"t": "Serve", "a": "with toast"}], "chefSteps": [{"t": "Wilt the spinach", "a": "Melt butter over medium. Cook 1 minced garlic clove for 30 seconds, then add 2 big handfuls of spinach and stir 1 minute until wilted. Season with salt.", "tip": "Spinach shrinks a lot — use more than you think."}, {"t": "Scramble low and slow", "a": "Lower the heat. Add 4 beaten eggs and stir slowly with a spatula for 2–3 minutes, making big soft curds.", "tip": "Constant gentle stirring makes creamy eggs, not dry ones."}, {"t": "Finish with cheese", "a": "Take the pan off the heat while the eggs still look a little wet. Fold in shredded cheese and let it melt. Serve with buttered toast.", "tip": "Eggs keep cooking on the plate — pull them early."}]},
{"name": "Bacon Hash Brown Skillet", "category": "breakfast", "ingredients": ["Potatoes", "Bacon", "Onions", "Bell peppers", "Eggs", "Cheddar"], "simpleSteps": [{"t": "Cook bacon", "a": "save fat"}, {"t": "Crisp potatoes", "a": "in fat"}, {"t": "Add veggies", "a": "soften"}, {"t": "Eggs + cheese", "a": "cover"}], "chefSteps": [{"t": "Render the bacon", "a": "Cook 5 strips of chopped bacon in a large skillet over medium for 7–8 minutes until crisp. Remove the bacon and keep 2 tbsp fat in the pan.", "tip": "Bacon fat gives the potatoes huge flavor."}, {"t": "Crisp the potatoes", "a": "Add diced potatoes in one layer. Cook without stirring for 5 minutes, then flip and cook 8–10 minutes more until crisp and tender. Add onion and bell pepper for the last 4 minutes.", "tip": "Don't crowd the pan — crowded potatoes steam instead of crisp."}, {"t": "Add eggs and cheese", "a": "Make 4 wells, crack in the eggs, scatter cheddar and bacon over everything. Cover and cook 4–5 minutes until the whites set.", "tip": "Bring the whole skillet to the table."}]},
{"name": "Egg & Avocado Breakfast Sandwich", "category": "breakfast", "ingredients": ["Bread", "Eggs", "Avocado", "Cheese", "Tomatoes", "Butter"], "simpleSteps": [{"t": "Toast bread", "a": "buttered"}, {"t": "Fry egg", "a": "jammy yolk"}, {"t": "Mash avocado", "a": "salt + lime"}, {"t": "Stack", "a": "cheese, tomato"}], "chefSteps": [{"t": "Toast in butter", "a": "Butter two slices of bread and toast in a skillet over medium for 2 minutes per side.", "tip": "Pan toasting gives a crunchier, richer outside than a toaster."}, {"t": "Fry the egg", "a": "Fry an egg in butter over medium for 2–3 minutes. Flip, lay a slice of cheese on top, and cook 30 seconds more.", "tip": "Break the yolk before flipping if you don't want drips."}, {"t": "Stack it", "a": "Mash half an avocado with salt and pepper and spread it on the toast. Add the cheesy egg and a thick tomato slice. Top and press lightly.", "tip": "Salt the tomato slice — it tastes twice as good."}]},
{"name": "Microwave Mug Omelette", "category": "breakfast", "ingredients": ["Eggs", "Milk", "Cheese", "Bell peppers", "Spinach"], "simpleSteps": [{"t": "Whisk in mug", "a": "eggs + milk"}, {"t": "Add fillings", "a": "cheese, veggies"}, {"t": "Microwave", "a": "30 sec bursts"}, {"t": "Eat", "a": "from the mug"}], "chefSteps": [{"t": "Mix in the mug", "a": "Grease a big mug. Whisk 2 eggs and 1 tbsp milk in it with a fork. Stir in diced bell pepper, a few spinach leaves and cheese. Season.", "tip": "Use a big mug — the eggs puff up."}, {"t": "Microwave in bursts", "a": "Microwave 30 seconds, stir, then 30–45 seconds more until just set.", "tip": "Short bursts keep the eggs from going rubbery."}, {"t": "Finish", "a": "Top with more cheese and let it sit 30 seconds to melt.", "tip": "Breakfast in 2 minutes with only one mug to wash."}]},
{"name": "Berry Yogurt Toast", "category": "breakfast", "ingredients": ["Bread", "Greek yogurt", "Blueberries", "Honey", "Cinnamon"], "simpleSteps": [{"t": "Toast bread", "a": "crisp"}, {"t": "Spread yogurt", "a": "thick"}, {"t": "Add berries", "a": "+ honey"}, {"t": "Cinnamon", "a": "sprinkle"}], "chefSteps": [{"t": "Toast", "a": "Toast thick bread until crisp and golden, about 3 minutes.", "tip": "Sturdy bread holds the yogurt best."}, {"t": "Spread", "a": "Spread a thick layer of Greek yogurt on the warm toast.", "tip": "Stir a little honey into the yogurt first if you like it sweeter."}, {"t": "Top", "a": "Add blueberries, a drizzle of honey and a pinch of cinnamon.", "tip": "High protein and ready in 5 minutes."}]},
{"name": "Homemade Turkey Breakfast Sausage", "category": "breakfast", "ingredients": ["Turkey", "Maple syrup", "Garlic powder", "Paprika", "Red pepper flakes", "Eggs", "Bread"], "simpleSteps": [{"t": "Season turkey", "a": "maple + spice"}, {"t": "Form patties", "a": "thin"}, {"t": "Sear", "a": "3 min per side"}, {"t": "Serve", "a": "eggs + toast"}], "chefSteps": [{"t": "Season the meat", "a": "Mix 1 lb ground turkey with 1 tbsp maple syrup, 1 tsp salt, ½ tsp garlic powder, ½ tsp paprika, ½ tsp pepper and a pinch of red pepper flakes. Mix gently with your hands.", "tip": "Fry a tiny piece to taste and fix the seasoning before shaping all of them."}, {"t": "Shape thin patties", "a": "Form 8 patties about ½ inch thick. Press a dimple in the middle of each so they stay flat.", "tip": "Wet hands stop the turkey from sticking."}, {"t": "Sear", "a": "Cook in a little oil over medium-high for 3–4 minutes per side until browned and cooked through (165°F). Serve with eggs and toast.", "tip": "Freeze extra raw patties between parchment for quick mornings."}]},
{"name": "Salmon Breakfast Rice Bowl", "category": "breakfast", "ingredients": ["Salmon", "Rice", "Eggs", "Avocado", "Soy sauce", "Green onions", "Sesame oil"], "simpleSteps": [{"t": "Warm rice", "a": "day-old ok"}, {"t": "Sear salmon", "a": "crispy skin"}, {"t": "Fry egg", "a": "runny"}, {"t": "Build bowl", "a": "soy + sesame"}], "chefSteps": [{"t": "Sear the salmon", "a": "Pat a salmon fillet dry and season with salt. Sear skin-side down in a hot oiled pan for 4–5 minutes, then flip and cook 1–2 minutes more. Flake into big pieces.", "tip": "Press the fillet flat for the first 10 seconds so the skin crisps evenly."}, {"t": "Fry the egg", "a": "Fry an egg in the same pan for 2 minutes until the white is crisp at the edges and the yolk is runny.", "tip": "A little leftover salmon fat makes the egg taste amazing."}, {"t": "Build the bowl", "a": "Put warm rice in a bowl. Add the salmon, egg and sliced avocado. Drizzle with soy sauce and a few drops of sesame oil. Top with green onions.", "tip": "Break the yolk and mix it into the rice like a sauce."}]},
{"name": "PB Banana Smoothie Bowl", "category": "breakfast", "ingredients": ["Bananas", "Greek yogurt", "Peanut butter", "Milk", "Oats", "Honey"], "simpleSteps": [{"t": "Freeze bananas", "a": "sliced"}, {"t": "Blend thick", "a": "little milk"}, {"t": "Pour in bowl", "a": "spoonable"}, {"t": "Top", "a": "oats, banana"}], "chefSteps": [{"t": "Use frozen bananas", "a": "Slice ripe bananas and freeze for at least 2 hours. Frozen banana is what makes it thick like soft-serve.", "tip": "Keep a bag of sliced bananas in the freezer at all times."}, {"t": "Blend it thick", "a": "Blend 2 frozen bananas, ½ cup Greek yogurt, 2 tbsp peanut butter and just ¼ cup milk. Stop and scrape often.", "tip": "Add milk 1 tablespoon at a time — too much and it becomes a drink."}, {"t": "Top it", "a": "Spoon into a bowl. Top with oats, fresh banana slices, a drizzle of peanut butter and honey.", "tip": "Chill the bowl in the freezer for 5 minutes first so it stays thick longer."}]},

{"name": "Breakfast Grilled Cheese", "category": "breakfast", "ingredients": ["Bread", "Eggs", "Cheddar", "Bacon", "Butter"], "simpleSteps": [{"t": "Cook bacon", "a": "crispy"}, {"t": "Scramble eggs", "a": "soft"}, {"t": "Build sandwich", "a": "cheese both sides"}, {"t": "Grill", "a": "low + slow"}], "chefSteps": [{"t": "Prep the fillings", "a": "Cook 3 strips of bacon until crisp. Softly scramble 2 eggs in butter and season.", "tip": "Keep the eggs a little loose — they finish in the sandwich."}, {"t": "Build it", "a": "Butter the outside of two bread slices. Inside, layer cheddar, eggs, bacon and more cheddar.", "tip": "Cheese on both sides glues everything together."}, {"t": "Grill low and slow", "a": "Cook in a skillet over medium-low for 3–4 minutes per side, pressing gently, until golden and the cheese is fully melted.", "tip": "Cover the pan for the first side to help the cheese melt before the bread burns."}]},

{"name": "Chicken Pesto Sandwich", "category": "lunch", "ingredients": ["Bread", "Chicken breast", "Basil", "Parmesan", "Olive oil", "Garlic", "Mozzarella", "Tomatoes"], "simpleSteps": [{"t": "Blend pesto", "a": "basil, parm, oil"}, {"t": "Cook chicken", "a": "sliced"}, {"t": "Build", "a": "mozzarella, tomato"}, {"t": "Toast", "a": "pressed"}], "chefSteps": [{"t": "Quick pesto", "a": "Blend 2 cups basil, ¼ cup parmesan, 1 garlic clove, ⅓ cup olive oil and salt until smooth.", "tip": "Extra pesto keeps a week in the fridge with oil on top."}, {"t": "Cook the chicken", "a": "Season thin chicken slices and sear 3–4 minutes per side.", "tip": "Pound the chicken thin so it cooks fast and evenly."}, {"t": "Build and press", "a": "Spread pesto on bread, add chicken, mozzarella and tomato. Toast in a skillet, pressing with another pan, 3 minutes per side.", "tip": "A heavy pan on top makes it panini-style."}]},

/* ================= CAMERA SCAN =================
   Uses two free AI models that run right in the browser (no account, no key):
   - COCO-SSD finds separate objects in the photo
   - MobileNet names what each object (and each part of the photo) looks like
   They only know some foods, so the user confirms results before adding. */

const SCAN_LIBS = [
  "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js",
  "https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js",
  "https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"
];

// What the AI calls it -> your pantry ingredient name
const SCAN_WORDS = {
  "banana":"Bananas", "broccoli":"Broccoli", "carrot":"Carrots",
  "bell pepper":"Bell peppers", "mushroom":"Mushrooms", "agaric":"Mushrooms", "bolete":"Mushrooms",
  "lemon":"Lemon", "french loaf":"Bread", "bagel":"Bread", "sandwich":"Bread",
  "guacamole":"Avocado", "mashed potato":"Potatoes", "hotdog":"Sausage", "hot dog":"Sausage",
  "burrito":"Tortilla", "chocolate sauce":"Chocolate", "honeycomb":"Honey",
  "meat loaf":"Ground beef", "cheeseburger":"Ground beef", "carbonara":"Pasta",
  "coho":"Salmon", "milk can":"Milk", "zucchini":"Zucchini", "corn":"Corn", "ear":"Corn"
};

let scanModels = null;
let scanFound = [];

function loadScript(src){
  return new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = src; el.onload = res; el.onerror = () => rej(new Error("load failed"));
    document.head.appendChild(el);
  });
}

async function getScanModels(){
  if(scanModels) return scanModels;
  // Give up after 45 seconds instead of spinning forever (e.g. no internet or a blocked viewer)
  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 45000));
  const load = (async () => {
    for(const src of SCAN_LIBS) await loadScript(src);
    const [net, det] = await Promise.all([mobilenet.load({version:2, alpha:1.0}), cocoSsd.load()]);
    return {net, det};
  })();
  scanModels = await Promise.race([load, timeout]);
  return scanModels;
}

function scanStatus(html){
  const area = document.getElementById("scanArea");
  if(area) area.innerHTML = html;
}

function toPantryName(label){
  const l = label.toLowerCase();
  for(const word in SCAN_WORDS){
    if(l.includes(word) && ingredientItems.includes(SCAN_WORDS[word])) return SCAN_WORDS[word];
  }
  return null;
}

function cropCanvas(src, x, y, w, h){
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
  c.getContext("2d").drawImage(src, x, y, w, h, 0, 0, c.width, c.height);
  return c;
}

// Claude vision: available when the app is opened from its claude.ai link
async function getClaudeVision(){
  try{
    if(!window.claude || typeof window.claude.use !== "function") return null;
    const s = await window.claude.use("sample");
    if(!s) return null;
    const lim = await s.limits().catch(() => null);
    return lim && lim.images ? s : null;
  }catch(e){ return null; }
}

function canvasToBlob(c){
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
}

function resizeTo(img, maxSide){
  const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}

const CLAUDE_ERRORS = {
  not_granted: "Claude wasn't allowed to look at photos. Tap ingredients below instead, or reopen the app and choose Allow.",
  rate_limited: "Too many scans right now. Wait a minute and try again.",
  image_rejected: "That photo couldn't be read. Try a different picture.",
  session_expired: "Please sign in to Claude again, then try another scan."
};

async function scanPhoto(input){
  const file = input.files && input.files[0];
  input.value = "";
  if(!file) return;

  const url = URL.createObjectURL(file);
  const preview = `<img src="${url}" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:8px;">`;
  const busy = msg => scanStatus(`<div class="card">${preview}<div style="text-align:center;">🔥 ${msg}</div></div>`);
  busy("Getting ready...");

  let img;
  try{
    img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  }catch(e){
    scanStatus(`<div class="card" style="text-align:center;">😕 That photo couldn't be opened. Try another one.</div>`);
    return;
  }

  // ---- Option A: Claude looks at the photo (smart: reads labels, many items at once)
  const vision = await getClaudeVision();
  if(vision){
    busy("Claude is looking at your food... (can take up to a minute)");
    try{
      const blob = await canvasToBlob(resizeTo(img, 1280));
      const prompt =
        "This photo shows someone's food at home (fridge, pantry, cupboard, counter or groceries). " +
        "List every ingredient from the list below that you can see in the photo. Count packaged items " +
        "when you can tell what they are from the label, bottle or box. Don't guess at things you can't see.\n\n" +
        "Allowed names (copy them exactly): " + JSON.stringify(ingredientItems) + "\n\n" +
        'Reply with only a JSON array of matching names, for example ["Eggs","Milk"]. Reply [] if none are visible.';
      const answer = await vision.json(prompt, { images: [blob] });
      const lookup = {};
      ingredientItems.forEach(n => lookup[n.toLowerCase()] = n);
      const found = new Set();
      (Array.isArray(answer) ? answer : []).forEach(a => {
        const n = lookup[String(a).trim().toLowerCase()];
        if(n) found.add(n);
      });
      scanFound = [...found];
      showScanResults(preview, true);
    }catch(e){
      const msg = CLAUDE_ERRORS[e && e.code] || "The scan didn't finish. Try again in a moment.";
      scanStatus(`<div class="card">${preview}<div style="text-align:center;">😕 ${msg}</div>
        <div class="btn" onclick="scanStatus('')" style="padding:10px;">OK</div></div>`);
    }
    return;
  }

  // ---- Option B: basic AI that runs in the browser (works outside Claude)
  busy(scanModels ? "Looking at your food..." : "Loading the AI (first scan only, takes a moment)...");
  try{
    const small = resizeTo(img, 640);
    const {net, det} = await getScanModels();
    busy("Looking at your food...");

    const found = new Set();
    const W = small.width, H = small.height;

    const objects = await det.detect(small, 20, 0.3);
    for(const o of objects){
      const hit = toPantryName(o.class);
      if(hit && o.score >= 0.4) found.add(hit);
      const [x, y, w, h] = o.bbox;
      if(w > 20 && h > 20){
        const guesses = await net.classify(cropCanvas(small, x, y, w, h), 3);
        guesses.forEach(g => { const n = toPantryName(g.className); if(n && g.probability >= 0.2) found.add(n); });
      }
    }

    const regions = [[0,0,W,H],[0,0,W/2,H/2],[W/2,0,W/2,H/2],[0,H/2,W/2,H/2],[W/2,H/2,W/2,H/2]];
    for(const [x, y, w, h] of regions){
      const guesses = await net.classify(cropCanvas(small, x, y, w, h), 5);
      guesses.forEach(g => { const n = toPantryName(g.className); if(n && g.probability >= 0.15) found.add(n); });
    }

    scanFound = [...found];
    showScanResults(preview, false);
  } catch(e){
    scanModels = null;
    scanStatus(`<div class="card" style="text-align:center;">😕 The scanner couldn't load. It needs internet and a regular browser (Chrome or Safari). App previews block it.<br><small style="opacity:.6">You can still tap ingredients below.</small></div>`);
  }
}

function showScanResults(preview, usedClaude){
  if(scanFound.length === 0){
    scanStatus(`<div class="card">${preview}<div style="text-align:center;">🤔 I didn't recognize anything.<br><small style="opacity:.6">Try one item at a time in good light, or tap ingredients below.</small></div>
      <div class="btn" onclick="scanStatus('')" style="padding:10px;">OK</div></div>`);
    return;
  }
  let html = `<div class="card">${preview}<b>I spotted:</b><small style="opacity:.6;display:block;margin-bottom:6px;">Tap to uncheck anything that's wrong.</small>`;
  scanFound.forEach(name => {
    const have = selected.includes(name);
    html += `<div class="item selected" data-name="${name}" onclick="this.classList.toggle('selected');this.firstChild.textContent=this.classList.contains('selected')?'✅ ':'⬜ '"><span>✅ </span>${name}${have ? ' <small style="opacity:.6">(already in pantry)</small>' : ""}</div>`;
  });
  html += `<div class="btn btn-chef" onclick="addScanned()">Add to pantry</div>
    <div class="btn btn-feedback" onclick="scanStatus('')" style="padding:10px;">Cancel</div>
    <small style="opacity:.55;display:block;margin-top:8px;">${usedClaude
      ? "Scanned by Claude. Anything it missed, tap in the list below."
      : "The basic scanner knows fresh foods best (bananas, broccoli, carrots, peppers, mushrooms, lemons, bread). Packaged items like sauces and spices need to be tapped below."}</small></div>`;
  scanStatus(html);
}

function addScanned(){
  document.querySelectorAll("#scanArea .item.selected").forEach(el => {
    const n = el.dataset.name;
    if(!selected.includes(n)) selected.push(n);
  });
  storeSet("ingredients", JSON.stringify(selected));
  scanStatus("");
  renderPantryList(document.getElementById("pantrySearch").value);
  updatePantryCount();
}

function updatePantryCount(){
  const el = document.getElementById("pantryCount");
  if(el) el.textContent = `${selected.length} ingredient${selected.length === 1 ? "" : "s"} selected`;
}

function showMatches(){
  const cats = ["all", ...new Set(recipes.map(r => r.category).filter(Boolean))];
  let html = `<div class="header">🍳 Recipes</div>`;

  html += `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:6px;">`;
  cats.forEach(c => {
    const on = c === recipeFilter;
    html += `<div class="item${on ? " selected" : ""}" style="margin:0;padding:6px 14px;text-transform:capitalize;" onclick="setFilter('${c}')">${c}</div>`;
  });
  html += `</div>`;

  if(selected.length === 0){
    html += `<div class="modeBadge">Tip: add ingredients in your Pantry to see your best matches first.</div>`;
  }

  const list = recipes
    .map((r, i) => ({r, i, m: matchCount(r)}))
    .filter(x => recipeFilter === "all" || x.r.category === recipeFilter)
    .sort((a, b) => (b.m / b.r.ingredients.length) - (a.m / a.r.ingredients.length));

  list.forEach(({r, i, m}) => {
    const total = r.ingredients.length;
    const missing = r.ingredients.filter(x => !selected.includes(x));
    const pct = Math.round(m / total * 100);
    const fav = favorites.includes(r.name) ? `<span class="fav-badge">★ Saved</span>` : "";
    html += `
      <div class="card" onclick="openRecipe(${i})" style="cursor:pointer;">
        <div style="display:flex;gap:12px;align-items:center;">
          ${photoImg(r.name, "thumb", 200)}
          <div style="flex:1;min-width:0;">
            <b>${r.name}</b>${fav}<br>
            <small style="opacity:0.7">Match: ${m}/${total} (${pct}%)${r.category ? " · " + r.category : ""}</small>
          </div>
        </div>
        <div style="height:6px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:8px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:${pct === 100 ? "#4ade80" : "#4facfe"};"></div>
        </div>
        ${missing.length ? `<small style="opacity:0.55;display:block;margin-top:6px;">Missing: ${missing.join(", ")}</small>`
                         : `<small style="color:#4ade80;display:block;margin-top:6px;">You have everything! 🎉</small>`}
      </div>`;
  });

  document.getElementById("results").innerHTML = html;
  show("results");
}

function setFilter(c){
  recipeFilter = c;
  showMatches();
}

/* ================= SHARE ================= */
const APP_LINK = "https://therustychef.com";

// Each recipe gets its own link, e.g. therustychef.com/#chicken-tacos
function recipeSlug(r){
  return r.name.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

function recipeLink(r){
  return APP_LINK + "/?recipe=" + recipeSlug(r);
}

function shareText(r){
  return `Check out ${r.name} on The Rusty Chef 🔥 ${recipeLink(r)}`;
}

// Opening a shared link goes straight to that recipe.
// Works with ?recipe=chicken-tacos (main format) and #chicken-tacos (older links).
function linkSlug(){
  let slug = "";
  try{ slug = new URLSearchParams(location.search).get("recipe") || ""; }catch(e){}
  if(!slug) slug = (location.hash || "").replace(/^#\/?/, "");
  try{ slug = decodeURIComponent(slug); }catch(e){}
  return slug.trim().toLowerCase();
}

function openFromLink(){
  const slug = linkSlug();
  if(!slug) return;
  if(slug === "game"){ openGame(); return; } // therustychef.com/#game opens the game
  const i = recipes.findIndex(r => recipeSlug(r) === slug);
  if(i >= 0) openRecipe(i);
}
window.addEventListener("hashchange", openFromLink);

function smsHref(r){
  // iPhone uses "&body=", Android uses "?body="
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  return "sms:" + (ios ? "&" : "?") + "body=" + encodeURIComponent(shareText(r));
}

async function shareRecipe(ev){
  if(ev) ev.preventDefault();
  const r = recipes[currentRecipe];
  if(!r) return;
  // Try the phone's share sheet first. Inside the Claude app it's often blocked,
  // so anything other than "they closed it" falls back to our own share panel.
  if(navigator.share){
    try{
      await navigator.share({ title: "The Rusty Chef: " + r.name, text: `Check out ${r.name} on The Rusty Chef 🔥`, url: recipeLink(r) });
      return;
    }catch(e){
      if(e && e.name === "AbortError") return;
    }
  }
  openSharePanel(r);
}

function openSharePanel(r){
  closeSharePanel();
  gtag("event", "share", { method: "share_panel", item_id: recipeSlug(r), content_type: "recipe" });
  const msg = shareText(r);
  const el = document.createElement("div");
  el.id = "sharePanel";
  el.style.cssText = "position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;";
  el.onclick = e => { if(e.target === el) closeSharePanel(); };
  el.innerHTML = `
    <div style="background:#1a1a1a;width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.15);">
      <div class="header" style="margin-bottom:6px;">📲 Share ${r.name}</div>

/* ================= STEP TIMERS ================= */
let stepTimers = {};

function stepSeconds(text){
  const m = text.match(/(\d+(?:\.\d+)?)(?:\s*(?:–|-|to)\s*(\d+(?:\.\d+)?))?\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)\b/i);
  if(!m) return 0;
  const n = parseFloat(m[2] || m[1]);
  const u = m[3].toLowerCase();
  const secs = u.startsWith("h") ? n * 3600 : u.startsWith("m") ? n * 60 : n;
  return secs >= 10 && secs <= 4 * 3600 ? Math.round(secs) : 0;
}

function fmtTime(s){
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0");
}

function clearTimers(){
  Object.values(stepTimers).forEach(t => clearInterval(t.iv));
  stepTimers = {};
}

function drawTimer(n){
  const t = stepTimers[n], el = document.getElementById("timer" + n);
  if(!t || !el) return;
  el.querySelector(".tm-clock").textContent = fmtTime(t.left);
  el.querySelector(".tm-go").textContent = t.left === 0 ? "Done!" : t.iv ? "Pause" : (t.left < t.total ? "Resume" : "Start");
  el.classList.toggle("done", t.left === 0);
}

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.4, 0.8].forEach(d => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.3, ctx.currentTime + d);
      o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.25);
    });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); }catch(e){}
}

function toggleTimer(n){
  const t = stepTimers[n];
  if(!t || t.left === 0) return;
  if(t.iv){ clearInterval(t.iv); t.iv = null; }
  else{
    t.iv = setInterval(() => {
      t.left = Math.max(0, t.left - 1);
      if(t.left === 0){ clearInterval(t.iv); t.iv = null; beep(); }
      drawTimer(n);
    }, 1000);
  }
  drawTimer(n);
}

function resetTimer(n){
  const t = stepTimers[n];
  if(!t) return;
  clearInterval(t.iv); t.iv = null; t.left = t.total;
  drawTimer(n);
}

        ${secs ? `<div class="step-timer" id="timer${n}">

            <span class="tm-label">⏱️ Step timer</span>
            <span class="tm-btn tm-go" onclick="toggleTimer(${n})">Start</span>
            <span class="tm-btn tm-reset" onclick="resetTimer(${n})">↺</span>
          </div>` : ""}
      </div>`;
  });

  document.getElementById("recipe").innerHTML = html;
}


/* ================= GAME ================= */
</script>
<script>
(function(){

/* ===== constants ===== */
const gameOn=()=>{const g=document.getElementById('game');return !!g&&g.classList.contains('active');};
const W=768,H=640,CELL=32,FY=[110,192,274,356,438,520],PLATE_Y=598,TOP=44;
const LADDERS=[[0,0,5],[23,0,5],[5,0,2],[6,2,5],[11,1,4],[12,0,1],[12,4,5],[17,0,3],[18,3,5]].map(([c,a,b])=>({x:c*CELL+16,top:FY[a],bot:FY[b],a,b}));
const BCOLS=[1,7,13,19];
const LAYOUTS=[
  [[0,1,3,4],[0,2,3,5],[1,2,4,5],[0,1,2,4]],
  [[0,2,4,5],[1,2,3,5],[0,1,3,5],[0,2,3,4]],
  [[1,2,3,5],[0,1,4,5],[0,2,3,4],[1,3,4,5]],
];
const LH={top:18,cheese:7,lettuce:8,patty:12,bottom:12};
const C={amber:'#f0a23a',neon:'#ff5a2a',ink:'#121011',steel:'#62686d',steelHi:'#8e959a',rust:'#a9501f',rust2:'#6e3315',cream:'#efe6d2'};
const cv=document.getElementById('rg-cv'),ctx=cv.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ===== storage ===== */
function sget(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let HI=+sget('rbr-hi',0)||0;

/* ===== audio ===== */
let ac=null,muted=sget('rbr-mute','0')==='1';
function au(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function beep(f1,f2,d,type='square',v=.06,delay=0){if(muted||!au())return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,30),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function hiss(d,v=.08,freq=3000){if(muted||!au())return;const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=ac.createGain();g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0005,ac.currentTime+d);s.connect(f).connect(g).connect(ac.destination);s.start()}
const SFX={
  step:()=>beep(520,600,.04,'square',.025),
  drop:()=>{beep(300,90,.18,'triangle',.12)},
  land:()=>beep(140,70,.12,'square',.08),
  plate:()=>{beep(660,660,.08,'square',.05);beep(880,880,.1,'square',.05,.08)},
  squash:()=>{hiss(.18,.15,800);beep(200,60,.2,'sawtooth',.06)},
  spray:()=>hiss(.3,.09,4500),
  stun:()=>beep(900,300,.25,'triangle',.06),
  die:()=>{hiss(.9,.12,2500);beep(400,40,1,'sawtooth',.07)},
  bonus:()=>{[784,988,1175,1568].forEach((f,i)=>beep(f,f,.09,'square',.05,i*.07))},
  clear:()=>{[523,659,784,1046,784,1046].forEach((f,i)=>beep(f,f,.14,'square',.06,i*.12))},
  start:()=>{[392,523,659].forEach((f,i)=>beep(f,f,.1,'square',.05,i*.09))},
};

/* ===== input ===== */
const K={left:0,right:0,up:0,down:0,fire:0};let fireEdge=false;
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'fire',KeyX:'fire',KeyJ:'fire'};
addEventListener('keydown',e=>{if(!gameOn())return;const k=KEYMAP[e.code];if(k){e.preventDefault();if(k==='fire'&&!K.fire)fireEdge=true;K[k]=1;startIfIdle(k);}
  if(e.code==='Enter'){e.preventDefault();startIfIdle('enter');}if(e.code==='KeyP'||e.code==='Escape')togglePause();});
addEventListener('keyup',e=>{if(!gameOn())return;const k=KEYMAP[e.code];if(k)K[k]=0;});
addEventListener('blur',()=>{for(const k in K)K[k]=0;if(G.state==='play')togglePause(true);});
document.querySelectorAll('#game .rg-pad button').forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();if(k==='fire'&&!K.fire)fireEdge=true;K[k]=1;b.classList.add('on');startIfIdle(k);try{b.setPointerCapture(e.pointerId)}catch(_){}};
  const off=e=>{K[k]=0;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);});
cv.addEventListener('pointerdown',()=>startIfIdle('tap'));
document.getElementById('rg-mute').onclick=e=>{muted=!muted;sset('rbr-mute',muted?'1':'0');e.currentTarget.textContent=muted?'Sound off':'Sound on';e.currentTarget.setAttribute('aria-pressed',muted);if(!muted)au();};
document.getElementById('rg-mute').textContent=muted?'Sound off':'Sound on';
document.getElementById('rg-pause').onclick=()=>togglePause();

/* ===== game state ===== */
const G={state:'title',score:0,lives:3,level:1,t:0,stateT:0,layers:[],enemies:[],fx:[],pops:[],plateH:[0,0,0,0],drops:0,bonus:null,bonusUsed:false,spawnT:0,toSpawn:0};
const P={x:380,y:FY[5],face:1,walk:0,climb:false,oil:5,spray:0,dead:0};
function startIfIdle(k){au();if(G.state==='title'||(G.state==='over'&&G.stateT>1)){newGame();}else if(G.state==='paused'&&k!=='fire')togglePause();}
function togglePause(force){if(G.state==='play'){G.state='paused';}else if(G.state==='paused'&&!force){G.state='play';}document.getElementById('rg-pause').textContent=G.state==='paused'?'Resume':'Pause';}
function newGame(){G.score=0;G.lives=3;G.level=1;startLevel();SFX.start();}
function startLevel(){
  const lay=LAYOUTS[(G.level-1)%LAYOUTS.length];G.layers=[];G.plateH=[0,0,0,0];G.drops=0;G.bonus=null;G.bonusUsed=false;
  BCOLS.forEach((c,i)=>{const kinds=['top',i%2?'cheese':'lettuce','patty','bottom'];lay[i].forEach((row,j)=>G.layers.push({kind:kinds[j],col:i,x:c*CELL,row,y:FY[row],segs:[0,0,0,0],falling:false,onPlate:false,dip:0}));});
  P.oil=5;resetActors();G.state='play';G.stateT=0;
}
function resetActors(){P.x=380;P.y=FY[5];P.face=1;P.climb=false;P.dead=0;P.spray=0;G.enemies=[];G.fx=[];G.toSpawn=Math.min(6,1+G.level);G.spawnT=1.2;}
const ETYPES=[{kind:'blob',spd:1.0},{kind:'ketchup',spd:1.25},{kind:'mustard',spd:1.5}];
const SPAWNS=[[16,0],[752,0],[16,5],[752,5]];
function spawnEnemy(){const opts=SPAWNS.map(([x,r])=>({x,y:FY[r],d:Math.hypot(x-P.x,FY[r]-P.y)})).sort((a,b)=>b.d-a.d);const s=opts[Math.floor(Math.random()*2)];
  const ty=ETYPES[G.enemies.length%3];const e={kind:ty.kind,spd:ty.spd*(1+0.08*(G.level-1))*0.92,x:s.x,y:s.y,dx:0,dy:0,lad:null,stun:0,dead:0,ride:null,t:Math.random()*9,respawn:0};
  decide(e,true);G.enemies.push(e);}

/* ===== geometry helpers ===== */
function nearestFloor(y,tol){for(let r=0;r<FY.length;r++)if(Math.abs(y-FY[r])<=tol)return r;return -1}
function ladderFor(x,y,dir,tol){for(const L of LADDERS){if(Math.abs(x-L.x)>tol)continue;if(dir<0&&y>L.top+0.01&&y<=L.bot+0.5)return L;if(dir>0&&y>=L.top-0.5&&y<L.bot-0.01)return L;}return null}

/* ===== enemy AI ===== */
function decide(e,first){
  const opts=[],r=nearestFloor(e.y,0.6);
  if(r>=0){e.y=FY[r];if(e.x>14)opts.push([-1,0,null]);if(e.x<W-14)opts.push([1,0,null]);}
  for(const L of LADDERS){if(Math.abs(L.x-e.x)>0.6)continue;if(e.y>L.top+0.5&&e.y<=L.bot+0.5)opts.push([0,-1,L]);if(e.y<L.bot-0.5&&e.y>=L.top-0.5)opts.push([0,1,L]);}
  let pool=opts.filter(o=>first||!(o[0]===-e.dx&&o[1]===-e.dy&&(o[0]||o[1])));if(!pool.length)pool=opts;if(!pool.length)return;
  let pick;
  if(Math.random()<0.25)pick=pool[Math.floor(Math.random()*pool.length)];
  else{const score=o=>{let s=0;const dyP=P.y-e.y,dxP=P.x-e.x;if(o[1])s+=Math.abs(dyP)>16?(Math.sign(dyP)===o[1]?3:-2):-1;if(o[0])s+=Math.abs(dyP)<=16?(Math.sign(dxP)===o[0]?3:-1):(Math.sign(dxP)===o[0]?0.6:0);return s+Math.random()*0.5};
    pick=pool.reduce((a,b)=>score(b)>score(a)?b:a);}
  if(pick[2])e.x=pick[2].x;e.dx=pick[0];e.dy=pick[1];e.lad=pick[2];
}
function moveEnemy(e,f){
  const step=e.spd*f*(e.kind==='blob'?(0.8+0.4*Math.abs(Math.sin(e.t*3))):1);
  if(e.dx){const r=nearestFloor(e.y,0.6);const nx=e.x+e.dx*step;
    for(const L of LADDERS){if(r<L.a||r>L.b)continue;if(e.x!==L.x&&((e.x-L.x)*(nx-L.x)<0||nx===L.x)){e.x=L.x;decide(e);return;}}
    if(nx<14||nx>W-14){e.x=clamp(nx,14,W-14);decide(e);return;}e.x=nx;}
  else if(e.dy&&e.lad){const ny=e.y+e.dy*step,L=e.lad;
    for(let k=L.a;k<=L.b;k++){const fy=FY[k];if(e.y!==fy&&((e.y-fy)*(ny-fy)<0||ny===fy)){e.y=fy;decide(e);return;}}
    e.y=ny;}
  else decide(e);
}

/* ===== layers ===== */
function startFall(L,byPlayer){
  L.falling=true;L.segs=[0,0,0,0];
  if(L.row>=5){L.targetRow='plate';L.targetY=PLATE_Y-G.plateH[L.col];G.plateH[L.col]+=LH[L.kind];}
  else{L.targetRow=L.row+1;L.targetY=FY[L.row+1];}
  L.riders=G.enemies.filter(e=>!e.dead&&!e.ride&&nearestFloor(e.y,0.6)===L.row&&e.x>L.x-8&&e.x<L.x+136&&e.dy===0);
  L.riders.forEach(e=>{e.ride=L;});

  SFX.drop();
}
function settle(L){
  L.falling=false;L.y=L.targetY;
  if(L.targetRow==='plate'){L.onPlate=true;addScore(100,L.x+64,L.y-20);SFX.plate();}
  else{L.row=L.targetRow;addScore(50,L.x+64,L.y-20);SFX.land();
    const below=G.layers.find(o=>o!==L&&o.col===L.col&&!o.falling&&!o.onPlate&&o.row===L.row);if(below)startFall(below,false);}
  if(L.riders&&L.riders.length){const n=L.riders.length;const pts=500*Math.pow(2,n-1);L.riders.forEach(e=>kill(e));addScore(pts,L.x+64,L.y-46,'RIDE!');}
  L.riders=null;
  if(G.layers.every(o=>o.onPlate&&!o.falling)){G.state='clear';G.stateT=0;addScore(1000*G.level,384,300,'ORDER UP!');SFX.clear();}
}
function kill(e){e.dead=0.7;e.ride=null;e.respawn=4;SFX.squash();}
function addScore(n,x,y,label){G.score+=n;if(G.score>HI){HI=G.score;sset('rbr-hi',HI);}G.pops.push({x,y,t:1.1,txt:label?label+' '+n:''+n});}

/* ===== update ===== */
function update(f){
  const dt=f/60;G.t+=dt;G.stateT+=dt;
  G.pops.forEach(p=>{p.t-=dt;p.y-=20*dt});G.pops=G.pops.filter(p=>p.t>0);
  G.fx.forEach(p=>{p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt});G.fx=G.fx.filter(p=>p.t>0);
  if(G.state==='clear'){if(G.stateT>2.6){G.level++;startLevel();}return;}
  if(G.state!=='play')return;
  // falling layers

    if(L.riders)L.riders.forEach(e=>{e.y=L.y;});
    for(const e of G.enemies){if(e.dead||e.ride||e.respawn>0&&e.dead)continue;if(L.riders&&L.riders.includes(e))continue;

    if(e.dead===-1){e.respawn-=dt;if(e.respawn<=0){const s=SPAWNS[Math.floor(Math.random()*4)];if(Math.hypot(s[0]-P.x,FY[s[1]]-P.y)>160){Object.assign(e,{x:s[0],y:FY[s[1]],dead:0,stun:0,dx:0,dy:0,lad:null});decide(e,true);}}continue;}
    if(e.ride)continue;

    ctx.save();ctx.translate(W/2,488);ctx.scale(1.5,1.5);drawRusty(0,0,{face:1,walk:G.t*2,moving:true});ctx.restore();
    ctx.font="14px 'Silkscreen',monospace";ctx.fillStyle='#8b8378';ctx.fillText('HI '+String(HI).padStart(6,'0'),W/2,570);}
  if(G.state==='paused')panel(['PAUSED'],['Take a break. The grease will wait.'],'PRESS P OR TAP TO RESUME');

  if(G.state==='play'&&G.stateT<1.6){ctx.textAlign='center';ctx.font="26px 'Bungee','Arial Black',sans-serif";ctx.fillStyle=C.cream;ctx.fillText('ORDER #'+G.level,W/2,82);}
}

/* ---------- planner ---------- */
function ghRecipeInfo(r){
  const meats = [...new Set(r.ingredients.filter(i => GH_MEAT_GROUP[i]).map(i => GH_MEAT_GROUP[i]))];
  return {meats};
}
function ghServingCost(r, skipSet){
  return r.ingredients.reduce((sum, i) => { const d = GH_INGREDIENTS[i]; return (!d || skipSet.has(i)) ? sum : sum + d[1] / d[2]; }, 0);
}
function ghLikeScore(r, likes){
  let s = 0;
  likes.forEach(k => {
    if(k === "breakfast" && r.category === "breakfast") s += 1;
    if(k === "mexican" && /taco|burrito|quesadilla|enchilada|fajita|nacho|huevos|mexican|chilaquiles|migas|carnitas/i.test(r.name)) s += 3;
    if(k === "asian" && /fried rice|stir|teriyaki|ramen|curry|lo mein|asian|sesame|satay|peanut noodles|korean|egg drop|bang bang|tikka|thai/i.test(r.name)) s += 2;
    (GH_LIKE_INGS[k] || []).forEach(i => { if(r.ingredients.includes(i)) s += (["chicken","beef","pork","fish"].includes(k) ? 3 : 1.5); });
  });
  return s;
}
function ghCost(plan, days, people, skipSet, extras){
  const need = {}, usedIn = {};
  GH_MEALS.forEach(([cat]) => {
    const list = plan[cat]; if(!list.length) return;
    for(let d = 0; d < days; d++){
      const r = list[d % list.length];
      r.ingredients.forEach(i => {
        if(skipSet.has(i) || !GH_INGREDIENTS[i]) return;
        need[i] = (need[i] || 0) + people;
        (usedIn[i] = usedIn[i] || new Set()).add(r.name);
      });
    }
  });
  const items = Object.keys(need).map(i => {
    const [label, price, spp, wid] = GH_INGREDIENTS[i];
    const units = Math.max(1, Math.ceil(need[i] / spp));
    return {name: i, units, label, cost: units * price, wid, usedIn: [...usedIn[i]]};
  });
  extras.forEach(([name, ppd, size, label, price, wid]) => {
    const units = Math.max(1, Math.ceil(ppd * people * days / size));
    items.push({name: name.replace(" (snacks)",""), units, label, cost: units * price, wid, usedIn: ["snacks"]});
  });
  return {items, total: items.reduce((a,b) => a + b.cost, 0)};
}

let ghList = [], ghPlan = null;
function runGrocery(){
  const people = Math.round(ghVal("ghPeople", 1));
  const days = Math.round(ghVal("ghDays", 1));
  const money = parseFloat(document.getElementById("ghMoney").value);
  const skipStaples = document.getElementById("ghSkip").checked;
  const out = document.getElementById("ghOut");
  if(!isFinite(money) || money <= 0){
    out.innerHTML = `<div class="card" style="text-align:center;color:#fbbf24;font-weight:700;">Enter how much money you have to spend.</div>`;
    return;
  }
  storeSet("groceryHelper", JSON.stringify({people, money, days, likes: ghLikes, skipStaples}));
  const likes = ghLikes;
  const pantrySet = new Set(typeof selected !== "undefined" ? selected : []);
  const skipSet = new Set([...pantrySet, ...(skipStaples ? Object.keys(GH_INGREDIENTS).filter(i => GH_INGREDIENTS[i][4]) : [])]);
  const pickedMeats = likes.filter(k => ["chicken","beef","pork","fish"].includes(k));
  const vegOnly = likes.includes("veg") && !pickedMeats.length;

  // which recipes are allowed, and how good a fit each one is
  const allowedFor = cat => {
    const inCat = recipes.filter(r => r.category === cat);
    let ok = inCat.filter(r => {
      const m = ghRecipeInfo(r).meats;
      if(vegOnly) return m.length === 0;
      if(pickedMeats.length) return m.every(g => pickedMeats.includes(g));
      return true;
    });
    if(ok.length < 2) ok = vegOnly ? inCat.filter(r => !ghRecipeInfo(r).meats.length) : inCat;
    if(!ok.length) ok = inCat;
    return ok.map(r => ({r, score: ghLikeScore(r, likes), cost: ghServingCost(r, skipSet)}));
  };
  const pools = {}; GH_MEALS.forEach(([c]) => pools[c] = allowedFor(c));
  const k = Math.min(days, 4);
  const plan = {};
  GH_MEALS.forEach(([c]) => {
    plan[c] = pools[c].slice().sort((a,b) => (b.score - b.cost*0.6) - (a.score - a.cost*0.6)).slice(0, k).map(x => x.r);
  });
  let extras = [];
  if(likes.includes("fruit")) extras = extras.concat(GH_EXTRAS.fruit);
  if(likes.includes("snacks")) extras = extras.concat(GH_EXTRAS.snacks);

  // fit the budget, keeping the foods they like as long as possible:
  // 1) drop snack extras  2) cook fewer different dishes (fewer things to buy)  3) swap to cheaper dishes, losing as little "like" as possible  4) one dish per meal
  const score = r => ghLikeScore(r, likes);
  const recost = () => ghCost(plan, days, people, skipSet, extras);
  let res = recost();
  if(res.total > money && extras.length){ extras = []; res = recost(); }
  const dropOne = minKeep => {
    const c = GH_MEALS.map(([c]) => c).filter(c => plan[c].length > minKeep).sort((a,b) => plan[b].length - plan[a].length)[0];
    if(!c) return false;
    plan[c].sort((a,b) => (score(a) - ghServingCost(a, skipSet)) - (score(b) - ghServingCost(b, skipSet))).shift();
    res = recost(); return true;
  };
  while(res.total > money && dropOne(2)){}
  for(let guard = 0; guard < 60 && res.total > money; guard++){
    let best = null;
    GH_MEALS.forEach(([c]) => plan[c].forEach((cur, idx) => {
      pools[c].forEach(({r}) => {
        if(plan[c].includes(r)) return;
        const trial = {...plan, [c]: plan[c].map((x,j) => j === idx ? r : x)};
        const t = ghCost(trial, days, people, skipSet, extras).total;
        const saved = res.total - t;
        if(saved <= 0.01) return;
        const value = saved / (1 + Math.max(0, score(cur) - score(r)) * 2);
        if(!best || value > best.value) best = {value, c, idx, r};
      });
    }));
    if(best){ plan[best.c][best.idx] = best.r; res = recost(); continue; }
    if(!dropOne(1)) break;
  }

  ghPlan = plan;
  ghList = res.items.sort((a,b) => a.name.localeCompare(b.name)).map(it => ({...it, got:false}));
  const total = res.total, over = total > money, left = money - total;
  const m2 = n => "$" + n.toFixed(2);
  const personDays = people * days;
  const inPantry = [...new Set(GH_MEALS.flatMap(([c]) => plan[c].flatMap(r => r.ingredients)))].filter(i => pantrySet.has(i));
  const skippedStaples = skipStaples ? [...new Set(GH_MEALS.flatMap(([c]) => plan[c].flatMap(r => r.ingredients)))].filter(i => GH_INGREDIENTS[i] && GH_INGREDIENTS[i][4] && !pantrySet.has(i)) : [];

  const timesCooked = (c, r) => { const L = plan[c]; let n = 0; for(let d = 0; d < days; d++) if(L[d % L.length] === r) n++; return n; };
  out.innerHTML = `
    <div class="card">
      <div style="font-weight:800;font-size:17px;margin-bottom:6px;">📋 ${people} ${people===1?"person":"people"} · ${days} ${days===1?"day":"days"} · ${m2(money)}</div>
      <div class="gh-stats">
        <div class="gh-stat"><b>${m2(money/personDays)}</b><span>per person, per day</span></div>
        <div class="gh-stat"><b>${personDays*3}</b><span>meals to cover</span></div>
        <div class="gh-stat"><b>${m2(total)}</b><span>estimated total</span></div>
        <div class="gh-stat"><b class="${over?"gh-over":"gh-ok"}">${over?"−"+m2(-left):m2(left)}</b><span>${over?"over budget":"left over"}</span></div>
      </div>
    </div>
    <div class="card">
      <div style="font-weight:800;margin-bottom:2px;">🍽️ Your meal plan</div>
      <div style="font-size:12px;opacity:.6;margin-bottom:6px;">Rusty Chef recipes — tap one to see how to make it.</div>
      ${GH_MEALS.map(([c, label]) => `
        <div style="font-weight:700;color:#ff914d;margin:10px 0 4px;">${label}</div>
        ${plan[c].map(r => `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;" onclick="openRecipe(${recipes.indexOf(r)})">
            ${photoImg(r.name, "thumb small", 150)}
            <div style="flex:1;min-width:0;"><b>${r.name}</b><div style="font-size:12px;opacity:.6;">${timesCooked(c, r)}× in ${days} ${days===1?"day":"days"} · serves ${people}</div></div>
            <span style="opacity:.5;">›</span></div>`).join("")}`).join("")}
    </div>
    <a class="btn" href="${ghCartUrl()}" target="_blank" onclick="ghList.forEach(x=>x.got=true);setTimeout(ghRenderList,300);" style="display:block;text-decoration:none;background:#0071ce;color:white;font-size:19px;padding:18px;box-shadow:0 6px 24px rgba(0,113,206,.45);">🛒 Add everything to my Walmart cart</a>
    <div style="text-align:center;opacity:.55;font-size:12px;margin:6px 0 10px;">One tap puts the whole list in your Walmart cart. If something is sold out at your store, use the one-at-a-time button below.</div>
    <div class="btn btn-feedback" id="ghNext" onclick="ghShopNext()" style="font-size:14px;padding:12px;"></div>
    <div class="card" id="ghListBox"></div>
    ${inPantry.length ? `<div class="card" style="font-size:13px;line-height:1.5;">🧺 <b>Already in your Pantry</b> (left off the list): ${inPantry.join(", ")}</div>` : ""}
    ${skippedStaples.length ? `<div class="card" style="font-size:13px;line-height:1.5;opacity:.85;">🧂 <b>Basics you said you have</b> (left off the list): ${skippedStaples.join(", ")}</div>` : ""}
    ${over ? `<div class="card" style="color:#fbbf24;font-size:14px;line-height:1.5;">⚠️ This is the cheapest plan the helper could find and it's still about ${m2(-left)} over. Try fewer days, add things you already have to your 🧺 Pantry, or pick fewer likes.</div>`
           : left >= 5 ? `<div class="card" style="font-size:14px;line-height:1.5;">💡 You have about ${m2(left)} extra — grab drinks, snacks, or a treat.</div>` : ""}
    <div class="btn btn-feedback" id="ghCopy" onclick="ghCopyList()">📋 Copy meal plan &amp; list</div>
    <div style="text-align:center;opacity:.45;font-size:11px;margin-top:10px;">Prices are rough estimates — Walmart prices vary by store.</div>`;
  ghRenderList();
  out.scrollIntoView({behavior:"smooth", block:"start"});
}

function ghRenderList(){
  const box = document.getElementById("ghListBox"); if(!box) return;
  const done = ghList.filter(x=>x.got).length;
  box.innerHTML = `<div style="display:flex;justify-content:space-between;font-weight:800;margin-bottom:4px;"><span>🛒 Shopping list</span><span style="opacity:.6;font-size:13px;">${done}/${ghList.length} added</span></div>` +
    ghList.map((it,i) => `<div class="gh-item" style="${it.got?"opacity:.45;":""}">
      <div style="flex:1;min-width:0;" onclick="ghList[${i}].got=!ghList[${i}].got;ghRenderList();">${it.got?"✅":"⬜"} ${it.name}<div class="q">${it.units} × ${it.label} · ~$${it.cost.toFixed(2)}</div>${it.usedIn && it.usedIn[0] !== "snacks" ? `<div class="q" style="opacity:.5;">for ${it.usedIn.join(", ")}</div>` : ""}</div>
      <a target="_blank" href="${ghItemUrl(it)}" onclick="ghList[${i}].got=true;setTimeout(ghRenderList,300);" style="flex-shrink:0;align-self:center;background:#0071ce;color:white;text-decoration:none;font-weight:700;font-size:13px;padding:6px 12px;border-radius:20px;">🛒 Walmart</a>
    </div>`).join("");
  const next = ghList.find(x=>!x.got), btn = document.getElementById("ghNext");
  if(btn) btn.innerHTML = next ? `Or add one at a time: ${next.name} (${done+1}/${ghList.length})` : "✅ All added! Open your Walmart cart";
}

function ghItemUrl(it){ return it.wid ? "https://www.walmart.com/ip/" + it.wid : shopUrl(it.name); }

function ghCartUrl(){
  const items = ghList.filter(x => x.wid).map(x => x.units > 1 ? x.wid + "|" + x.units : x.wid);
  return "https://www.walmart.com/sc/cart/addToCart?items=" + items.join(",");
}

function ghShopNext(){
  const next = ghList.find(x=>!x.got);
  if(!next){ window.open("https://www.walmart.com/cart", "_blank"); return; }
  next.got = true;
  window.open(ghItemUrl(next), "_blank");
  setTimeout(ghRenderList, 300);
}

function ghCopyList(){
  let text = "🔥 The Rusty Chef meal plan\n";
  if(ghPlan) GH_MEALS.forEach(([c, label]) => { text += `\n${label}: ` + ghPlan[c].map(r => r.name).join(", "); });
  text += "\n\n🛒 Shopping list\n" + ghList.map(it => `• ${it.name} — ${it.units} × ${it.label}`).join("\n");
  const ok = () => { const b = document.getElementById("ghCopy"); if(b){ b.textContent = "✅ Copied!"; setTimeout(()=>b.innerHTML="📋 Copy meal plan &amp; list", 1800); } };
  try{ navigator.clipboard.writeText(text).then(ok, () => prompt("Copy your list:", text)); }catch(e){ prompt("Copy your list:", text); }
}
</script>
<script>
/* ================= HOME PAGE VIDEO POP-UP =================
   To change the video, paste any YouTube link between the quotes.
   Leave it empty ("") to turn the pop-up off. */
const HOME_VIDEO = "https://youtube.com/shorts/QNKS3vLqATM?is=N4aprHiKzi_zIepJ";

function ytId(v){
  v = (v || "").trim();
  const m = v.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(v) ? v : "");
}
function openVideoPop(){
  const id = ytId(HOME_VIDEO); if(!id) return;
  const pop = document.getElementById("videoPop");
  document.getElementById("vpFrame").innerHTML =
    '<iframe id="vpIframe" onload="ytUnmuteSoon()" src="https://www.youtube.com/embed/' + id +
    '?rel=0&playsinline=1&enablejsapi=1&origin=' + encodeURIComponent(location.origin) + '" title="The Rusty Chef video" ' +
    'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
  document.getElementById("vpYT").href = (/\/shorts\//.test(HOME_VIDEO) ? "https://www.youtube.com/shorts/" : "https://www.youtube.com/watch?v=") + id;
  pop.classList.toggle("tall", /\/shorts\//.test(HOME_VIDEO));   // Shorts are vertical
  pop.hidden = false; requestAnimationFrame(() => pop.classList.add("on"));
}
function closeVideoPop(forever){
  const pop = document.getElementById("videoPop"); if(!pop || pop.hidden) return;
  pop.classList.remove("on");
  setTimeout(() => { pop.hidden = true; document.getElementById("vpFrame").innerHTML = ""; }, 250); // stops the video
}
// talk to the YouTube player: Shorts can start muted, so turn the sound on
function ytSend(func, args){
  const f = document.getElementById("vpIframe"); if(!f || !f.contentWindow) return;
  f.contentWindow.postMessage(JSON.stringify({event: "command", func: func, args: args || []}), "*");
}
function ytSoundOn(){ ytSend("unMute"); ytSend("setVolume", [100]); }
function ytUnmuteSoon(){
  const f = document.getElementById("vpIframe"); if(!f) return;
  // ask the player to tell us when it starts playing, so we can turn the sound on right then
  f.contentWindow.postMessage(JSON.stringify({event: "listening", id: "vpIframe"}), "*");
  ytSend("addEventListener", ["onStateChange"]);
  [300, 1000, 2500].forEach(t => setTimeout(ytSoundOn, t));
}
window.addEventListener("message", e => {
  if(!/youtube\.com$/.test(new URL(e.origin || "http://x").hostname)) return;
  let d; try{ d = typeof e.data === "string" ? JSON.parse(e.data) : e.data; }catch(err){ return; }
  if(!d) return;
  const playing = (d.event === "onStateChange" && d.info === 1) || (d.info && d.info.playerState === 1);
  const muted = d.info && d.info.muted === true;
  if(playing || muted) ytSoundOn();      // the moment it plays (or if YouTube muted it), sound on
});
document.addEventListener("keydown", e => { if(e.key === "Escape") closeVideoPop(); });
(function(){ const go = window.menuGo; if(typeof go === "function") window.menuGo = function(fn, arg){ closeVideoPop(); return go(fn, arg); }; })();
// shows every time someone opens the site (on the front page)
function startVideoPop(){
  const active = (document.querySelector(".page.active") || {}).id;
  if(active === "home") setTimeout(openVideoPop, 600);
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", startVideoPop);
else startVideoPop();
</script>
